<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-rsud { background-color: #d97746; }
        .text-rsud { color: #d97746; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="https://via.placeholder.com/120x40?text=RSUD+AMP" alt="Logo" class="h-10">
            </div>
            <div class="flex items-center gap-3">
                <button class="bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-orange-700 transition">Cara Penggunaan</button>
                <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Greeting -->
        <h1 id="greeting" class="text-xl font-bold text-gray-800 mb-4">Halo, Memuat data...</h1>

        <!-- Filter Section (Orange Box) -->
        <div class="bg-rsud rounded-xl p-6 mb-6 shadow-md">
            <h2 class="text-2xl font-bold text-white mb-4">Daftar Pengajuan Obat</h2>
            
            <div class="mb-4">
                <input type="text" id="searchObat" placeholder="Nama Obat" class="w-full px-4 py-2.5 rounded-lg border-none focus:ring-2 focus:ring-orange-300 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-white mb-1">Dari Tanggal</label>
                    <input type="date" id="dariTanggal" class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-orange-300 outline-none">
                </div>
                <div>
                    <label class="block text-sm text-white mb-1">Sampai Tanggal</label>
                    <input type="date" id="sampaiTanggal" class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-orange-300 outline-none">
                </div>
                <div>
                    <label class="block text-sm text-white mb-1">Tipe Pengajuan</label>
                    <select id="tipePengajuan" class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-orange-300 outline-none bg-white">
                        <option value="">Semua</option>
                        <option value="reguler">Reguler</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-white mb-1">Ketua KSM</label>
                    <select id="filterKsm" class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-orange-300 outline-none bg-white">
                        <option value="">Semua</option>
                        <option value="Jantung">Jantung</option>
                        <option value="Syaraf dan Jiwa">Syaraf dan Jiwa</option>
                        <option value="IPD">IPD</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="resetFilter" class="text-white text-sm hover:underline">Reset Filter</button>
                <button id="searchBtn" class="bg-white text-rsud px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">Search</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center mb-4">
            <button id="ajukanBtn" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition flex items-center gap-2">
                <span>+</span> Ajukan Obat Baru
            </button>
            <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition flex items-center gap-2">
                <span>⬇</span> Download Excel
            </button>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                        <th class="p-4 font-semibold">No</th>
                        <th class="p-4 font-semibold">Tanggal</th>
                        <th class="p-4 font-semibold">Nama Obat</th>
                        <th class="p-4 font-semibold">KSM</th>
                        <th class="p-4 font-semibold">Status</th>
                        <th class="p-4 font-semibold">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-gray-700 text-sm divide-y divide-gray-100">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-gray-400">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://xxxxxx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Cek Sesi Login
        async function checkAuth() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }
            
            // Ambil Profil User dari tabel public.users
            const { data: profile, error: profileError } = await supabase
                .from('users')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (profile) {
                currentUser = profile;
                document.getElementById('greeting').textContent = `Halo, ${profile.nama_lengkap} (${profile.role.replace('_', ' ').toUpperCase()})`;
                
                // Sembunyikan tombol "Ajukan Obat Baru" jika bukan Admin KSM
                if (profile.role !== 'admin_ksm') {
                    document.getElementById('ajukanBtn').style.display = 'none';
                }
            }
            fetchPengajuan();
        }

        // Fetch Data Pengajuan
        async function fetchPengajuan() {
            const tbody = document.getElementById('tableBody');
            const { data, error } = await supabase
                .from('pengajuan')
                .select(`*, users:admin_ksm_id (nama_lengkap, ksm)`)
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Gagal memuat data.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">Belum ada pengajuan.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4">${index + 1}</td>
                    <td class="p-4">${new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID')}</td>
                    <td class="p-4 font-medium">${item.nama_obat}</td>
                    <td class="p-4">${item.users?.ksm || '-'}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusColor(item.status)}">
                            ${item.status.replace(/_/g, ' ').toUpperCase()}
                        </span>
                    </td>
                    <td class="p-4">
                        <button class="text-blue-600 hover:underline text-sm font-medium" onclick="lihatDetail('${item.id}')">Lihat</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusColor(status) {
            if (status === 'disetujui') return 'bg-green-100 text-green-700';
            if (status === 'ditolak') return 'bg-red-100 text-red-700';
            if (status === 'draft') return 'bg-gray-100 text-gray-700';
            return 'bg-orange-100 text-orange-700';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        // Placeholder Aksi
        document.getElementById('ajukanBtn').addEventListener('click', () => {
            alert('Fitur Ajukan Obat Baru akan diimplementasikan di tahap selanjutnya.');
        });
        
        function lihatDetail(id) {
            alert('Melihat detail pengajuan ID: ' + id);
        }

        // Jalankan saat halaman dimuat
        checkAuth();
    </script>
</body>
</html>
