<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Pengadaan Reguler - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-rsud { background-color: #d97746; }
        .text-rsud { color: #d97746; }
        .border-rsud { border-color: #d97746; }
        .step-active { background-color: #d97746; color: white; border-color: #d97746; }
        .step-inactive { background-color: white; color: #9ca3af; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            </div>
            <div class="flex items-center gap-3">
                <button class="bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-orange-700 transition">Cara Penggunaan</button>
                <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <!-- Tombol Kembali -->
        <a href="dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 border border-orange-300 text-rsud rounded-full text-sm hover:bg-orange-50 transition mb-6">
            <span>‹</span> Kembali Ke Halaman Awal
        </a>

        <!-- Progress Bar -->
        <div class="flex items-center justify-between mb-8 px-4">
            <div class="flex flex-col items-center flex-1">
                <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold step-active">1</div>
                <span class="text-xs mt-2 text-gray-700 text-center">Admin KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold step-inactive">2</div>
                <span class="text-xs mt-2 text-gray-500 text-center">Ketua KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold step-inactive">3</div>
                <span class="text-xs mt-2 text-gray-500 text-center">Anggota PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold step-inactive">4</div>
                <span class="text-xs mt-2 text-gray-500 text-center">Ketua PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold step-inactive">5</div>
                <span class="text-xs mt-2 text-gray-500 text-center">Wakil Direktur</span>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl border border-orange-200 shadow-sm p-8">
            <h1 class="text-2xl font-bold text-rsud text-center mb-8">Pengajuan Pengadaan Reguler</h1>

            <form id="pengajuanForm" class="space-y-6">
                
                <!-- Tanggal Pengajuan -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pengajuan <span class="text-red-500">*</span></label>
                    <input type="date" id="tanggalPengajuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                </div>

                <!-- Nama Obat -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Obat <span class="text-red-500">*</span></label>
                    <input type="text" id="namaObat" required placeholder="Contoh: Vitamin" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                </div>

                <!-- EBM & PPK/Konsensus -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">EBM & PPK/Konsensus <span class="text-red-500">*</span></label>
                    <div id="ebmContainer" class="border border-gray-200 rounded-lg p-4 space-y-3 bg-gray-50">
                        <!-- Baris EBM akan ditambahkan oleh JS -->
                    </div>
                    <button type="button" id="tambahEbmBtn" class="mt-3 bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-orange-700 transition flex items-center gap-1">
                        <span>+</span> Tambah Baru
                    </button>
                </div>

                <!-- Alasan Pengajuan -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alasan Pengajuan <span class="text-red-500">*</span></label>
                    <textarea id="alasanPengajuan" required rows="4" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none resize-none"></textarea>
                </div>

                <!-- Pemberi Persetujuan -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pemberi Persetujuan <span class="text-red-500">*</span></label>
                    <select id="pemberiPersetujuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none bg-white">
                        <option value="">-- Pilih Pemberi Persetujuan --</option>
                        <option value="Ketua KSM Jantung">Ketua KSM Jantung</option>
                        <option value="Ketua KSM Saraf dan Jiwa">Ketua KSM Saraf dan Jiwa</option>
                        <option value="Ketua KSM Bedah Gigi & Mulut">Ketua KSM Bedah Gigi & Mulut</option>
                        <option value="Ketua KSM Paru">Ketua KSM Paru</option>
                        <option value="Ketua KSM Kulit">Ketua KSM Kulit</option>
                        <option value="Ketua KSM Penunjang">Ketua KSM Penunjang</option>
                        <option value="Ketua KSM Umum">Ketua KSM Umum</option>
                        <option value="Ketua KSM IPD">Ketua KSM IPD</option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-rsud text-white font-semibold py-3 rounded-full hover:bg-orange-700 transition">
                        Submit
                    </button>
                </div>

                <p id="errorMsg" class="text-red-500 text-sm text-center hidden"></p>
            </form>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ====== CEK AUTENTIKASI ======
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            // Set tanggal default hari ini
            document.getElementById('tanggalPengajuan').valueAsDate = new Date();
            // Tambah 1 baris EBM default
            tambahBarisEbm();
        }

        // ====== LOGIKA EBM MULTI-ROW ======
        function tambahBarisEbm() {
            const container = document.getElementById('ebmContainer');
            const row = document.createElement('div');
            row.className = 'ebm-row flex gap-2 items-center';
            row.innerHTML = `
                <select class="ebm-tipe px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-orange-500 outline-none w-32">
                    <option value="EBM">EBM</option>
                    <option value="PPK">PPK</option>
                    <option value="Konsensus">Konsensus</option>
                </select>
                <input type="text" class="ebm-nama flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="Nama (contoh: EBM Vita)">
                <input type="text" class="ebm-link flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="Link (contoh: https://...)">
                <button type="button" class="hapus-ebm text-red-500 hover:text-red-700 px-2 text-xl font-bold" title="Hapus">🗑</button>
            `;
            row.querySelector('.hapus-ebm').addEventListener('click', () => {
                // Minimal harus ada 1 baris
                if (container.querySelectorAll('.ebm-row').length > 1) {
                    row.remove();
                } else {
                    alert('Minimal harus ada 1 baris EBM/PPK.');
                }
            });
            container.appendChild(row);
        }

        document.getElementById('tambahEbmBtn').addEventListener('click', tambahBarisEbm);

        // ====== SUBMIT FORM ======
        document.getElementById('pengajuanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.textContent = 'Mengirim...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            // Kumpulkan data EBM dari semua baris
            const ebmRows = document.querySelectorAll('.ebm-row');
            const ebmData = [];
            ebmRows.forEach(row => {
                const tipe = row.querySelector('.ebm-tipe').value;
                const nama = row.querySelector('.ebm-nama').value.trim();
                const link = row.querySelector('.ebm-link').value.trim();
                if (nama) {
                    ebmData.push({ tipe, nama, link });
                }
            });

            if (ebmData.length === 0) {
                errorMsg.textContent = 'Minimal isi 1 nama EBM/PPK/Konsensus.';
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Submit';
                btn.disabled = false;
                return;
            }

            const payload = {
                p_tanggal: document.getElementById('tanggalPengajuan').value,
                p_nama_obat: document.getElementById('namaObat').value,
                p_ebm_ppk: ebmData, // JSONB
                p_alasan: document.getElementById('alasanPengajuan').value,
                p_pemberi_persetujuan: document.getElementById('pemberiPersetujuan').value
            };

            console.log('Mengirim data ke RPC submit_pengajuan:', payload);

            // Panggil fungsi RPC di Supabase
            const { data, error } = await supabaseClient.rpc('submit_pengajuan', payload);

            if (error) {
                console.error('Error saat submit:', error);
                errorMsg.textContent = 'Gagal submit: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Submit';
                btn.disabled = false;
                return;
            }

            console.log('Berhasil submit. ID pengajuan:', data);
            alert('Pengajuan berhasil dikirim!');
            window.location.href = 'dashboard.html';
        });

        // ====== LOGOUT ======
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // Jalankan saat halaman dimuat
        checkAuth();
    </script>
</body>
</html>
