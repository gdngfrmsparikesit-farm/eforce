<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pengajuan - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        .step-active { background-color: #059669; color: white; border-color: #059669; }
        .step-done { background-color: #22c55e; color: white; border-color: #22c55e; }
        .step-inactive { background-color: white; color: #9ca3af; border-color: #e5e7eb; }

        .tab-btn { padding: 8px 12px; font-size: 13px; font-weight: 500; color: #6b7280; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.15s ease; cursor: pointer; background: transparent; border-top: none; border-left: none; border-right: none; }
        .tab-btn:hover { color: #059669; background: #f0fdf4; }
        .tab-btn.active { color: #059669; border-bottom-color: #059669; background: #f0fdf4; font-weight: 600; }
        
        .mini-step { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 2px solid; }
        .mini-step.done { background: #22c55e; color: white; border-color: #22c55e; }
        .mini-step.active { background: #059669; color: white; border-color: #059669; }
        .mini-step.inactive { background: white; color: #9ca3af; border-color: #e5e7eb; }
        
        @media (min-width: 768px) {
            .mini-step { width: 28px; height: 28px; font-size: 12px; }
            .tab-btn { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <header class="bg-white shadow-sm border-b sticky top-0 z-20">
        <div class="w-full max-w-[95%] lg:max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-2 md:gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[95%] lg:max-w-6xl mx-auto px-4 py-4 md:py-6">

        <nav class="text-sm text-gray-500 mb-3">
            <a href="dashboard.html" class="hover:text-emerald-600">🏠 Dashboard</a>
            <span class="mx-2">›</span>
            <span class="text-rsud font-medium">Detail Pengajuan</span>
        </nav>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
            <a href="dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 border border-emerald-300 text-rsud rounded-full text-sm hover:bg-emerald-50 transition">
                <span>‹</span> Kembali
            </a>
            <button id="printDetailBtn" class="w-full sm:w-auto inline-flex justify-center items-center gap-2 px-4 py-2 bg-rsud text-white rounded-full text-sm hover:bg-emerald-700 transition">
                🖨️ Cetak PDF
            </button>
        </div>

        <!-- Progress Bar -->
        <div id="progressBar" class="flex items-center justify-between mb-6 px-2 md:px-4"></div>

        <!-- Loading & Error -->
        <div id="loadingState" class="text-center py-12 text-gray-400">Memuat data pengajuan...</div>
        <div id="errorState" class="hidden bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-700 text-sm"></div>

        <!-- Tab Navigation (Bisa di-scroll horizontal di HP) -->
        <div id="tabNav" class="hidden bg-white rounded-t-2xl border border-emerald-200 border-b-0 shadow-sm">
            <div class="overflow-x-auto scrollbar-hide">
                <div class="flex min-w-max px-1 md:px-2">
                    <button class="tab-btn active" data-tab="ringkasan">📋 Ringkasan</button>
                    <button class="tab-btn" data-tab="step1">1️⃣ Admin</button>
                    <button class="tab-btn" data-tab="step2">2️⃣ Ketua KSM</button>
                    <button class="tab-btn" data-tab="step3">3️⃣ Anggota PFT</button>
                    <button class="tab-btn" data-tab="step4">4️⃣ Ketua PFT</button>
                    <button class="tab-btn" data-tab="step5">5️⃣ Wadir</button>
                    <button class="tab-btn" data-tab="riwayat">📜 Riwayat</button>
                </div>
            </div>
        </div>

        <!-- Tab Content -->
        <div id="contentArea" class="hidden bg-white rounded-b-2xl border border-emerald-200 border-t-0 shadow-sm p-4 md:p-6">
            <div id="tab-ringkasan" class="tab-pane"></div>
            <div id="tab-step1" class="tab-pane hidden"></div>
            <div id="tab-step2" class="tab-pane hidden"></div>
            <div id="tab-step3" class="tab-pane hidden"></div>
            <div id="tab-step4" class="tab-pane hidden"></div>
            <div id="tab-step5" class="tab-pane hidden"></div>
            <div id="tab-riwayat" class="tab-pane hidden"></div>
        </div>

    </main>

    <script src="emailHelper.js"></script>
    <!-- (Salin seluruh isi script Javascript dari file detail.html Anda yang sebelumnya ke sini, TIDAK ADA yang perlu diubah pada logikanya) -->

</body>
</html>
