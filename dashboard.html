    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Cek Sesi Login
        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }
            
            // Ambil Profil User dari tabel public.users
            const { data: profile, error: profileError } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (profile) {
                currentUser = profile;
                document.getElementById('greeting').textContent = `Halo, ${profile.nama_lengkap} (${profile.role.replace('_', ' ').toUpperCase()})`;
                
                if (profile.role !== 'admin_ksm') {
                    document.getElementById('ajukanBtn').style.display = 'none';
                }
            } else {
                console.error('Profil tidak ditemukan di tabel public.users:', profileError);
            }
            fetchPengajuan();
        }

        // Fetch Data Pengajuan
        async function fetchPengajuan() {
            const tbody = document.getElementById('tableBody');
            const { data, error } = await supabaseClient
                .from('pengajuan')
                .select(`*, users:admin_ksm_id (nama_lengkap, ksm)`)
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Gagal memuat data.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">Belum ada pengajuan.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4">${index + 1}</td>
                    <td class="p-4">${new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID')}</td>
                    <td class="p-4 font-medium">${item.nama_obat}</td>
                    <td class="p-4">${item.users?.ksm || '-'}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusColor(item.status)}">
                            ${item.status.replace(/_/g, ' ').toUpperCase()}
                        </span>
                    </td>
                    <td class="p-4">
                        <button class="text-blue-600 hover:underline text-sm font-medium" onclick="lihatDetail('${item.id}')">Lihat</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusColor(status) {
            if (status === 'disetujui') return 'bg-green-100 text-green-700';
            if (status === 'ditolak') return 'bg-red-100 text-red-700';
            if (status === 'draft') return 'bg-gray-100 text-gray-700';
            return 'bg-orange-100 text-orange-700';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // Placeholder Aksi
        document.getElementById('ajukanBtn').addEventListener('click', () => {
            // Nanti kita arahkan ke form pengajuan.html
            alert('Fitur Ajukan Obat Baru akan diimplementasikan di tahap selanjutnya.');
        });
        
        function lihatDetail(id) {
            alert('Melihat detail pengajuan ID: ' + id);
        }

        // Jalankan saat halaman dimuat
        checkAuth();
    </script>
