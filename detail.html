<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pengajuan - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        .step-active { background-color: #059669; color: white; border-color: #059669; }
        .step-done { background-color: #22c55e; color: white; border-color: #22c55e; }
        .step-inactive { background-color: white; color: #9ca3af; border-color: #e5e7eb; }

        /* Tab styling */
        .tab-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.15s ease;
            cursor: pointer;
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab-btn:hover { color: #059669; background: #f0fdf4; }
        .tab-btn.active {
            color: #059669;
            border-bottom-color: #059669;
            background: #f0fdf4;
            font-weight: 600;
        }
        .tab-btn.has-task { position: relative; }
        .tab-btn.has-task::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse-slow 1.5s ease-in-out infinite;
        }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Scrollbar */
        .tab-scroll::-webkit-scrollbar { height: 4px; }
        .tab-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .tab-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        /* Timeline step compact */
        .mini-step {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
        }
        .mini-step.done { background: #22c55e; color: white; border-color: #22c55e; }
        .mini-step.active { background: #059669; color: white; border-color: #059669; }
        .mini-step.inactive { background: white; color: #9ca3af; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <header class="bg-white shadow-sm border-b sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <nav class="text-sm text-gray-500 mb-3">
            <a href="dashboard.html" class="hover:text-emerald-600">🏠 Dashboard</a>
            <span class="mx-2">›</span>
            <span class="text-rsud font-medium">Detail Pengajuan</span>
        </nav>

        <div class="flex justify-between items-center mb-5">
            <a href="dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 border border-emerald-300 text-rsud rounded-full text-sm hover:bg-emerald-50 transition">
                <span>‹</span> Kembali
            </a>
            <button id="printDetailBtn" class="inline-flex items-center gap-2 px-4 py-2 bg-rsud text-white rounded-full text-sm hover:bg-emerald-700 transition">
                🖨️ Cetak PDF
            </button>
        </div>

        <!-- Progress Bar -->
        <div id="progressBar" class="flex items-center justify-between mb-6 px-4"></div>

        <!-- Loading -->
        <div id="loadingState" class="text-center py-12 text-gray-400">Memuat data pengajuan...</div>
        <!-- Error -->
        <div id="errorState" class="hidden bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-700 text-sm"></div>

        <!-- ===== TAB NAVIGATION ===== -->
        <div id="tabNav" class="hidden bg-white rounded-t-2xl border border-emerald-200 border-b-0 shadow-sm">
            <div class="tab-scroll overflow-x-auto">
                <div class="flex min-w-max px-2">
                    <button class="tab-btn active" data-tab="ringkasan">📋 Ringkasan</button>
                    <button class="tab-btn" data-tab="step1">1️⃣ Admin KSM</button>
                    <button class="tab-btn" data-tab="step2">2️⃣ Ketua KSM</button>
                    <button class="tab-btn" data-tab="step3">3️⃣ Anggota PFT</button>
                    <button class="tab-btn" data-tab="step4">4️⃣ Ketua PFT</button>
                    <button class="tab-btn" data-tab="step5">5️⃣ Wadir</button>
                    <button class="tab-btn" data-tab="riwayat">📜 Riwayat</button>
                </div>
            </div>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div id="contentArea" class="hidden bg-white rounded-b-2xl border border-emerald-200 border-t-0 shadow-sm p-6">
            <div id="tab-ringkasan" class="tab-pane"></div>
            <div id="tab-step1" class="tab-pane hidden"></div>
            <div id="tab-step2" class="tab-pane hidden"></div>
            <div id="tab-step3" class="tab-pane hidden"></div>
            <div id="tab-step4" class="tab-pane hidden"></div>
            <div id="tab-step5" class="tab-pane hidden"></div>
            <div id="tab-riwayat" class="tab-pane hidden"></div>
        </div>

    </main>

    <script src="emailHelper.js"></script>
    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let pengajuan = null;
        let riwayat = [];
        let pengajuanId = null;

        const STEPS = [
            { key: 1, label: 'Admin KSM' },
            { key: 2, label: 'Ketua KSM' },
            { key: 3, label: 'Anggota PFT' },
            { key: 4, label: 'Ketua PFT' },
            { key: 5, label: 'Wakil Direktur' }
        ];

        // ====== UTIL ======
        function relativeTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffSec = Math.floor((now - date) / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            if (diffSec < 60) return 'baru saja';
            if (diffMin < 60) return `${diffMin} menit lalu`;
            if (diffHour < 24) return `${diffHour} jam lalu`;
            if (diffDay < 7) return `${diffDay} hari lalu`;
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function esc(str) {
            if (str === null || str === undefined) return '-';
            return String(str);
        }

        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            const errEl = document.getElementById('errorState');
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
            console.error('ERROR:', msg);
        }

        function fieldRow(label, value) {
            return `
                <div class="mb-3">
                    <div class="text-xs text-gray-500 uppercase tracking-wide mb-1">${label}</div>
                    <div class="text-sm text-gray-800 bg-gray-50 rounded px-3 py-2 border border-gray-200">${value || '-'}</div>
                </div>
            `;
        }

        // ====== LOAD DATA ======
        async function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                pengajuanId = params.get('id');
                if (!pengajuanId) {
                    alert('ID pengajuan tidak ditemukan.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError || !session) {
                    window.location.href = 'index.html';
                    return;
                }

                const { data: profile } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (!profile) {
                    showError('Akun Anda belum terdaftar di sistem.');
                    return;
                }
                currentUser = profile;

                const { data: pData, error: pError } = await supabaseClient
                    .from('pengajuan')
                    .select('*, pengaju:admin_ksm_id (nama_lengkap, ksm)')
                    .eq('id', pengajuanId)
                    .maybeSingle();

                if (pError) { showError('Gagal memuat: ' + pError.message); return; }
                if (!pData) { showError('Pengajuan tidak ditemukan.'); return; }
                pengajuan = pData;

                const { data: rData } = await supabaseClient
                    .from('riwayat_pengajuan')
                    .select('*, user:user_id (nama_lengkap, role)')
                    .eq('pengajuan_id', pengajuanId)
                    .order('created_at', { ascending: true });
                riwayat = rData || [];

                // Render semua
                renderProgressBar();
                renderAllTabs();
                setupTabs();

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('tabNav').classList.remove('hidden');
                document.getElementById('contentArea').classList.remove('hidden');

            } catch (err) {
                console.error('FATAL:', err);
                showError('Terjadi kesalahan: ' + err.message);
            }
        }

        // ====== PROGRESS BAR ======
        function renderProgressBar() {
            const currentStep = pengajuan.current_step;
            const container = document.getElementById('progressBar');
            let html = '';
            STEPS.forEach((step, idx) => {
                let cls = 'step-inactive';
                let inner = step.key;
                if (step.key < currentStep) { cls = 'step-done'; inner = '✓'; }
                else if (step.key === currentStep) { cls = 'step-active'; }
                html += `
                    <div class="flex flex-col items-center flex-1">
                        <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold ${cls}">${inner}</div>
                        <span class="text-xs mt-2 text-gray-700 text-center">${step.label}</span>
                    </div>
                `;
                if (idx < STEPS.length - 1) html += `<div class="flex-1 h-0.5 bg-gray-300 -mt-6"></div>`;
            });
            container.innerHTML = html;
        }

        // ====== TAB SETUP ======
        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });
        }

        function switchTab(tabName) {
            // Update active button
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            // Update visible pane
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.toggle('hidden', pane.id !== 'tab-' + tabName);
            });
            // Scroll to top of tab nav
            document.getElementById('tabNav').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ====== RENDER ALL TABS ======
        function renderAllTabs() {
            document.getElementById('tab-ringkasan').innerHTML = renderRingkasan();
            document.getElementById('tab-step1').innerHTML = renderStep1();
            document.getElementById('tab-step2').innerHTML = renderStep2();
            document.getElementById('tab-step3').innerHTML = renderStep3();
            document.getElementById('tab-step4').innerHTML = renderStep4();
            document.getElementById('tab-step5').innerHTML = renderStep5();
            document.getElementById('tab-riwayat').innerHTML = renderRiwayat();

            // Tandai tab yang membutuhkan perhatian
            const isMyTurn = checkIsMyTurn();
            if (isMyTurn) {
                const ringkasanBtn = document.querySelector('.tab-btn[data-tab="ringkasan"]');
                if (ringkasanBtn) ringkasanBtn.classList.add('has-task');
            }

            // Attach event listener form aksi
            const form = document.getElementById('actionForm');
            if (form) {
                form.addEventListener('submit', handleApprove);
                const rejectBtn = document.getElementById('rejectBtn');
                if (rejectBtn) rejectBtn.addEventListener('click', handleReject);
            }
        }

        function checkIsMyTurn() {
            const step = pengajuan.current_step;
            const role = currentUser.role;
            return (
                (step === 2 && role === 'ketua_ksm') ||
                (step === 3 && role === 'anggota_pft') ||
                (step === 4 && role === 'ketua_pft') ||
                (step === 5 && role === 'wadir')
            );
        }

        // ====== TAB: RINGKASAN ======
        function renderRingkasan() {
            const step = pengajuan.current_step;
            const role = currentUser.role;
            const isMyTurn = checkIsMyTurn();
            const statusInfo = getStatusInfo();

            // Ringkasan Card
            let html = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                    <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                        <div class="text-xs text-emerald-700 uppercase font-semibold mb-1">Nama Obat</div>
                        <div class="text-sm font-bold text-gray-800">${esc(pengajuan.nama_obat)}</div>
                    </div>
                    <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                        <div class="text-xs text-emerald-700 uppercase font-semibold mb-1">Tanggal</div>
                        <div class="text-sm font-bold text-gray-800">${new Date(pengajuan.tanggal_pengajuan).toLocaleDateString('id-ID')}</div>
                    </div>
                    <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                        <div class="text-xs text-emerald-700 uppercase font-semibold mb-1">KSM Pengaju</div>
                        <div class="text-sm font-bold text-gray-800">${esc(pengajuan.pengaju?.ksm || '-')}</div>
                    </div>
                    <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                        <div class="text-xs text-emerald-700 uppercase font-semibold mb-1">Status</div>
                        <div class="text-xs font-bold ${statusInfo.cls} px-2 py-1 rounded-full inline-block mt-1">${statusInfo.icon} ${statusInfo.label}</div>
                    </div>
                </div>
            `;

            // Alasan Pengajuan (highlight)
            html += `
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-5">
                    <div class="text-xs text-yellow-800 uppercase font-semibold mb-1">📋 Alasan Pengajuan</div>
                    <div class="text-sm text-gray-800">${esc(pengajuan.alasan_pengajuan)}</div>
                </div>
            `;

            // Mini Timeline
            html += `
                <div class="bg-white border border-gray-200 rounded-lg p-4 mb-5">
                    <div class="text-xs text-gray-500 uppercase font-semibold mb-3">🔄 Status Approval</div>
                    <div class="flex items-center justify-between gap-1">
            `;
            STEPS.forEach((s, idx) => {
                const stepLog = riwayat.find(r => r.role === roleFromStep(s.key) && r.aksi === 'approve');
                const stepReject = riwayat.find(r => r.role === roleFromStep(s.key) && r.aksi === 'reject');
                let cls = 'inactive';
                let inner = s.key;
                if (stepLog) { cls = 'done'; inner = '✓'; }
                else if (s.key === step && !stepLog) { cls = 'active'; }
                
                html += `
                    <div class="flex flex-col items-center flex-1">
                        <div class="mini-step ${cls}">${inner}</div>
                        <div class="text-[10px] text-gray-600 text-center mt-1 leading-tight">${s.label}</div>
                    </div>
                `;
                if (idx < STEPS.length - 1) {
                    html += `<div class="flex-1 h-0.5 ${stepLog ? 'bg-green-400' : 'bg-gray-300'} mb-5"></div>`;
                }
            });
            html += `</div></div>`;

            // FORM AKSI / BANNER
            if (isMyTurn) {
                html += `
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded mb-4">
                        <div class="flex items-center gap-2 text-yellow-800 font-semibold text-sm">
                            <span class="text-lg">⚡</span>
                            <span>Giliran Anda! Silakan review & proses pengajuan ini.</span>
                        </div>
                    </div>
                `;
                html += renderActionForm(role);
            } else if (step === 6) {
                html += `<div class="bg-green-50 border border-green-300 rounded-2xl p-6 text-center text-green-700 font-semibold">✓ Pengajuan ini sudah DISETUJUI sepenuhnya.</div>`;
            } else {
                html += `<div class="bg-blue-50 border border-blue-300 rounded-2xl p-4 text-center text-blue-700 text-sm">⏳ Menunggu giliran role lain untuk memproses pengajuan ini.</div>`;
            }

            return html;
        }

        function roleFromStep(step) {
            const map = { 1: 'admin_ksm', 2: 'ketua_ksm', 3: 'anggota_pft', 4: 'ketua_pft', 5: 'wadir' };
            return map[step];
        }

        function getStatusInfo() {
            const map = {
                'draft':                { label: 'Draft', icon: '📝', cls: 'bg-gray-100 text-gray-700' },
                'menunggu_ketua_ksm':   { label: 'Menunggu Ketua KSM', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_anggota_pft': { label: 'Menunggu Anggota PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_ketua_pft':   { label: 'Menunggu Ketua PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_wadir':       { label: 'Menunggu Wadir', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'disetujui':            { label: 'Disetujui', icon: '✅', cls: 'bg-green-100 text-green-700' },
                'ditolak':              { label: 'Ditolak', icon: '❌', cls: 'bg-red-100 text-red-700' }
            };
            return map[pengajuan.status] || { label: pengajuan.status, icon: '•', cls: 'bg-gray-100 text-gray-700' };
        }

        // ====== FORM AKSI ======
        function renderActionForm(role) {
            let html = `<div class="bg-white rounded-2xl border border-emerald-200 shadow-sm p-6">
                <h2 class="text-lg font-bold text-rsud mb-4">📝 Form Aksi — ${role.replace(/_/g, ' ').toUpperCase()}</h2>
                <form id="actionForm" class="space-y-4">`;

            if (role === 'ketua_ksm') {
                html += `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kriteria Restriksi <span class="text-red-500">*</span></label>
                        <input type="text" id="inputKriteria" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tinjau Pengajuan <span class="text-red-500">*</span></label>
                        <textarea id="inputCatatan" required rows="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                    </div>
                `;
            } else if (role === 'anggota_pft') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan Obat <span class="text-red-500">*</span></label>
                            <select id="inputKeterangan" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                                <option value="">-- Pilih --</option>
                                <option value="Obat Baru">Obat Baru</option>
                                <option value="Obat Lama">Obat Lama</option>
                                <option value="Pengganti">Pengganti</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Obat <span class="text-red-500">*</span></label>
                            <select id="inputJenis" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                                <option value="">-- Pilih --</option>
                                <option value="Tablet">Tablet</option>
                                <option value="Kapsul">Kapsul</option>
                                <option value="Sirup">Sirup</option>
                                <option value="Injeksi">Injeksi</option>
                                <option value="Salep">Salep</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Obat <span class="text-red-500">*</span></label>
                            <input type="text" id="inputNamaObat" required value="${esc(pengajuan.nama_obat)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harga Obat <span class="text-red-500">*</span></label>
                            <input type="number" id="inputHarga" required min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kategori Obat <span class="text-red-500">*</span></label>
                            <select id="inputKategori" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                                <option value="">-- Pilih --</option>
                                <option value="Generik">Generik</option>
                                <option value="Paten">Paten</option>
                                <option value="Generik Bermerek">Generik Bermerek</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Termasuk Kronis? <span class="text-red-500">*</span></label>
                            <select id="inputKronis" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                                <option value="">-- Pilih --</option>
                                <option value="Ya">Ya</option>
                                <option value="Tidak">Tidak</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Informasi Keamanan</label>
                            <div class="flex gap-4 mt-2">
                                <label class="flex items-center gap-2 text-sm"><input type="radio" name="infoKeamanan" value="Ya" class="w-4 h-4"> Ya</label>
                                <label class="flex items-center gap-2 text-sm"><input type="radio" name="infoKeamanan" value="Tidak" checked class="w-4 h-4"> Tidak</label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Obat Alternatif</label>
                            <input type="text" id="inputAlternatif" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harga Obat Alternatif</label>
                            <input type="number" id="inputHargaAlternatif" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                    </div>
                `;
            } else if (role === 'ketua_pft' || role === 'wadir') {
                html += `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Rekomendasi <span class="text-red-500">*</span></label>
                        <textarea id="inputCatatan" required rows="4" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
                    </div>
                `;
            }

            // Tombol Aksi
            if (role === 'anggota_pft') {
                html += `<button type="submit" id="submitBtn" class="w-full bg-rsud text-white font-semibold py-3 rounded-full hover:bg-emerald-700 transition">Submit</button>`;
            } else if (role === 'wadir') {
                html += `<button type="submit" id="submitBtn" class="w-full bg-green-500 text-white font-semibold py-3 rounded-full hover:bg-green-600 transition">✅ Approve Final</button>`;
            } else {
                html += `
                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <button type="button" id="rejectBtn" class="bg-red-500 text-white font-semibold py-3 rounded-full hover:bg-red-600 transition">❌ Reject</button>
                        <button type="submit" id="submitBtn" class="bg-green-500 text-white font-semibold py-3 rounded-full hover:bg-green-600 transition">✅ Approve</button>
                    </div>
                `;
            }
            html += `<p id="errorMsg" class="text-red-500 text-sm text-center hidden"></p>`;
            html += `</form></div>`;
            return html;
        }

        // ====== TAB: STEP 1 (Admin KSM) ======
        function renderStep1() {
            let ebmHtml = '';
            const ebmList = pengajuan.ebm_ppk || [];
            if (ebmList.length > 0) {
                ebmHtml = ebmList.map(e => 
                    `<div class="flex gap-2 mb-2 text-sm items-center">
                        <span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-xs font-medium">${esc(e.tipe)}</span>
                        <span class="text-gray-800">${esc(e.nama)}</span>
                        ${e.link ? `<a href="${esc(e.link)}" target="_blank" class="text-blue-600 hover:underline text-xs">Link</a>` : ''}
                    </div>`
                ).join('');
            } else {
                ebmHtml = '<div class="text-gray-400 text-sm">-</div>';
            }

            return `
                <h3 class="text-base font-bold text-rsud mb-4">1️⃣ Data Pengajuan (Admin KSM)</h3>
                ${fieldRow('Tanggal Pengajuan', new Date(pengajuan.tanggal_pengajuan).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }))}
                ${fieldRow('Nama Obat', pengajuan.nama_obat)}
                <div class="mb-3">
                    <div class="text-xs text-gray-500 uppercase tracking-wide mb-1">EBM & PPK/Konsensus</div>
                    <div class="bg-gray-50 rounded px-3 py-2 border border-gray-200">${ebmHtml}</div>
                </div>
                ${fieldRow('Alasan Pengajuan', pengajuan.alasan_pengajuan)}
                ${fieldRow('Pemberi Persetujuan', pengajuan.pemberi_persetujuan)}
                ${fieldRow('KSM Pengaju', pengajuan.pengaju?.ksm)}
                ${fieldRow('Diajukan Oleh', pengajuan.pengaju?.nama_lengkap)}
            `;
        }

        // ====== TAB: STEP 2 (Ketua KSM) ======
        function renderStep2() {
            const log = riwayat.find(r => r.role === 'ketua_ksm' && r.aksi === 'approve');
            if (!log && !pengajuan.kriteria_restriksi) {
                return `<div class="text-center py-8 text-gray-400 text-sm">⏳ Belum diproses oleh Ketua KSM</div>`;
            }
            return `
                <h3 class="text-base font-bold text-rsud mb-4">2️⃣ Kriteria Restriksi (Ketua KSM)</h3>
                ${fieldRow('Kriteria Restriksi', pengajuan.kriteria_restriksi)}
                ${log ? `
                    ${fieldRow('Tinjau Pengajuan', log.catatan)}
                    ${fieldRow('Diproses Oleh', log.user?.nama_lengkap)}
                    ${fieldRow('Tanggal', new Date(log.created_at).toLocaleString('id-ID'))}
                ` : ''}
            `;
        }

        // ====== TAB: STEP 3 (Anggota PFT) ======
        function renderStep3() {
            const df = pengajuan.data_farmasi || {};
            const log = riwayat.find(r => r.role === 'anggota_pft' && r.aksi === 'approve');
            if (!log && !df.keterangan_obat) {
                return `<div class="text-center py-8 text-gray-400 text-sm">⏳ Belum diproses oleh Anggota PFT</div>`;
            }
            return `
                <h3 class="text-base font-bold text-rsud mb-4">3️⃣ Data Farmasi (Anggota PFT)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                    <div>${fieldRow('Keterangan Obat', df.keterangan_obat)}</div>
                    <div>${fieldRow('Jenis Obat', df.jenis_obat)}</div>
                    <div>${fieldRow('Nama Obat', df.nama_obat || pengajuan.nama_obat)}</div>
                    <div>${fieldRow('Harga Obat', df.harga_obat ? 'Rp ' + Number(df.harga_obat).toLocaleString('id-ID') : null)}</div>
                    <div>${fieldRow('Kategori Obat', df.kategori_obat)}</div>
                    <div>${fieldRow('Termasuk Kronis', df.is_kronis)}</div>
                    <div>${fieldRow('Informasi Keamanan', df.info_keamanan)}</div>
                    <div>${fieldRow('Obat Alternatif', df.obat_alternatif)}</div>
                    <div>${fieldRow('Harga Alternatif', df.harga_alternatif ? 'Rp ' + Number(df.harga_alternatif).toLocaleString('id-ID') : null)}</div>
                </div>
            `;
        }

        // ====== TAB: STEP 4 (Ketua PFT) ======
        function renderStep4() {
            const log = riwayat.find(r => r.role === 'ketua_pft' && r.aksi === 'approve');
            if (!log) {
                return `<div class="text-center py-8 text-gray-400 text-sm">⏳ Belum diproses oleh Ketua PFT</div>`;
            }
            return `
                <h3 class="text-base font-bold text-rsud mb-4">4️⃣ Rekomendasi Ketua PFT</h3>
                ${fieldRow('Rekomendasi', log.catatan)}
                ${fieldRow('Diproses Oleh', log.user?.nama_lengkap)}
                ${fieldRow('Tanggal', new Date(log.created_at).toLocaleString('id-ID'))}
            `;
        }

        // ====== TAB: STEP 5 (Wadir) ======
        function renderStep5() {
            const log = riwayat.find(r => r.role === 'wadir' && r.aksi === 'approve');
            if (!log) {
                return `<div class="text-center py-8 text-gray-400 text-sm">⏳ Belum diproses oleh Wakil Direktur</div>`;
            }
            const statusInfo = getStatusInfo();
            return `
                <h3 class="text-base font-bold text-rsud mb-4">5️⃣ Keputusan Akhir (Wakil Direktur)</h3>
                <div class="mb-3">
                    <div class="text-xs text-gray-500 uppercase tracking-wide mb-1">Status Akhir</div>
                    <div class="text-sm font-bold ${statusInfo.cls} px-3 py-2 rounded-lg inline-block">${statusInfo.icon} ${statusInfo.label}</div>
                </div>
                ${fieldRow('Rekomendasi', log.catatan)}
                ${fieldRow('Diputuskan Oleh', log.user?.nama_lengkap)}
                ${fieldRow('Tanggal Keputusan', new Date(log.created_at).toLocaleString('id-ID'))}
            `;
        }

        // ====== TAB: RIWAYAT ======
        function renderRiwayat() {
            if (riwayat.length === 0) {
                return '<div class="text-center py-8 text-gray-400 text-sm">Belum ada riwayat.</div>';
            }
            return `
                <h3 class="text-base font-bold text-rsud mb-4">📜 Riwayat Approval</h3>
                <div class="space-y-3">
                    ${riwayat.map(r => {
                        const roleLabel = r.role ? r.role.replace(/_/g, ' ').toUpperCase() : 'UNKNOWN';
                        const aksiLabel = r.aksi ? r.aksi.toUpperCase() : '-';
                        const dotColor = r.aksi === 'approve' ? 'bg-green-500' : r.aksi === 'reject' ? 'bg-red-500' : 'bg-blue-500';
                        const aksiIcon = r.aksi === 'approve' ? '✅' : r.aksi === 'reject' ? '❌' : '📝';
                        return `
                            <div class="flex gap-3 pb-3 border-b border-gray-100 last:border-0">
                                <div class="w-2 h-2 rounded-full ${dotColor} mt-2 flex-shrink-0"></div>
                                <div class="flex-1">
                                    <div class="text-sm font-medium text-gray-800">
                                        ${r.user?.nama_lengkap || 'Unknown'} 
                                        <span class="text-xs text-gray-500">(${roleLabel})</span>
                                    </div>
                                    <div class="text-xs text-gray-500 mb-1">
                                        ${new Date(r.created_at).toLocaleString('id-ID')} • ${aksiIcon} ${aksiLabel} • ${relativeTime(r.created_at)}
                                    </div>
                                    ${r.catatan ? `<div class="text-sm text-gray-700 bg-gray-50 rounded px-3 py-2">${esc(r.catatan)}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // ====== HANDLE APPROVE ======
        async function handleApprove(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.textContent = 'Memproses...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const role = currentUser.role;
            let catatan = '';
            let kriteria = null;
            let farmasi = null;

            if (role === 'ketua_ksm') {
                kriteria = document.getElementById('inputKriteria').value;
                catatan = document.getElementById('inputCatatan').value;
            } else if (role === 'anggota_pft') {
                const infoKeamanan = document.querySelector('input[name="infoKeamanan"]:checked')?.value || 'Tidak';
                farmasi = {
                    keterangan_obat: document.getElementById('inputKeterangan').value,
                    jenis_obat: document.getElementById('inputJenis').value,
                    nama_obat: document.getElementById('inputNamaObat').value,
                    harga_obat: parseInt(document.getElementById('inputHarga').value) || 0,
                    kategori_obat: document.getElementById('inputKategori').value,
                    is_kronis: document.getElementById('inputKronis').value,
                    info_keamanan: infoKeamanan,
                    obat_alternatif: document.getElementById('inputAlternatif').value,
                    harga_alternatif: parseInt(document.getElementById('inputHargaAlternatif').value) || 0
                };
                catatan = 'Data farmasi telah dilengkapi';
            } else {
                catatan = document.getElementById('inputCatatan').value;
            }

            const { error } = await supabaseClient.rpc('approve_pengajuan', {
                p_id: pengajuanId,
                p_catatan: catatan,
                p_kriteria_restriksi: kriteria,
                p_data_farmasi: farmasi
            });

            if (error) {
                errorMsg.textContent = 'Gagal: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = role === 'anggota_pft' ? 'Submit' : '✅ Approve';
                btn.disabled = false;
                return;
            }

            alert('Berhasil!');
            
            // === KIRIM EMAIL (opsional) ===
            try {
                if (typeof sendEmailNotif === 'function') {
                    const nextRoleMap = {
                        'ketua_ksm':   { next: 'anggota_pft',  status: 'Menunggu Persetujuan' },
                        'anggota_pft': { next: 'ketua_pft',    status: 'Menunggu Persetujuan' },
                        'ketua_pft':   { next: 'wadir',        status: 'Menunggu Persetujuan' },
                        'wadir':       { next: 'admin_ksm',    status: 'Dikonfirmasi ✅' }
                    };
                    const nextInfo = nextRoleMap[role];
                    if (nextInfo) {
                        await sendEmailNotif(nextInfo.next, {
                            id: pengajuanId,
                            nama_obat: pengajuan.nama_obat,
                            pengaju: pengajuan.pengaju
                        }, nextInfo.status, catatan, supabaseClient);
                    }
                }
            } catch (emailErr) {
                console.error('Email gagal:', emailErr);
            }
            
            window.location.reload();
        }

        // ====== HANDLE REJECT ======
        async function handleReject() {
            const catatan = prompt('Masukkan alasan penolakan:');
            if (!catatan) return;

            const { error } = await supabaseClient.rpc('reject_pengajuan', {
                p_id: pengajuanId,
                p_catatan: catatan
            });

            if (error) {
                alert('Gagal reject: ' + error.message);
                return;
            }

            alert('Pengajuan ditolak.');
            
            // === KIRIM EMAIL (opsional) ===
            try {
                if (typeof sendEmailNotif === 'function') {
                    const stepBefore = {
                        2: 'admin_ksm',
                        3: 'ketua_ksm',
                        4: 'ketua_ksm',   // Ketua PFT reject → Ketua KSM
                        5: 'ketua_pft'
                    };
                    const targetRole = stepBefore[pengajuan.current_step];
                    if (targetRole) {
                        await sendEmailNotif(targetRole, {
                            id: pengajuanId,
                            nama_obat: pengajuan.nama_obat,
                            pengaju: pengajuan.pengaju
                        }, 'Tidak Dikonfirmasi ❌', catatan, supabaseClient);
                    }
                }
            } catch (emailErr) {
                console.error('Email gagal:', emailErr);
            }
            
            window.location.reload();
        }

        // ====== EVENT LISTENERS ======
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        document.getElementById('printDetailBtn').addEventListener('click', () => {
            window.open('cetak.html?mode=form&ids=' + encodeURIComponent(pengajuanId), '_blank');
        });

        init();
    </script>
</body>
</html>
