<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Pengajuan - E-Force</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @page { size: 215mm 330mm; margin: 15mm 12mm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
            color: #000;
            background: #f3f4f6;
            line-height: 1.4;
        }
        .preview-wrapper {
            max-width: 215mm;
            margin: 20px auto;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 15mm 12mm;
        }
        .no-print {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .btn-print, .btn-back {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        .btn-print { background: #059669; color: white; }
        .btn-print:hover { background: #047857; }
        .btn-back { background: #6b7280; color: white; }
        .btn-back:hover { background: #4b5563; }

        .kop-surat {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 10px;
            border-bottom: 3px double #000;
            margin-bottom: 15px;
        }
        .kop-logo {
            width: 70px;
            height: 70px;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9pt;
            color: #666;
            text-align: center;
            line-height: 1.1;
        }
        .kop-text { flex: 1; text-align: center; }
        .kop-text h1 { font-size: 14pt; font-weight: bold; letter-spacing: 0.5px; }
        .kop-text h2 { font-size: 13pt; font-weight: bold; }
        .kop-text p { font-size: 9pt; }
        .kop-text .alamat { font-size: 8.5pt; font-style: italic; margin-top: 3px; }

        .judul-doc { text-align: center; margin-bottom: 15px; }
        .judul-doc h3 {
            font-size: 13pt;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 3px;
        }
        .judul-doc .nomor { font-size: 10pt; }

        .section { margin-bottom: 12px; }
        .section-title {
            background: #e5e7eb;
            padding: 5px 8px;
            font-weight: bold;
            font-size: 10.5pt;
            border-left: 4px solid #059669;
            margin-bottom: 8px;
        }

        table.data-table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
        table.data-table td {
            padding: 4px 6px;
            vertical-align: top;
            border: 1px solid #999;
        }
        table.data-table td.label { width: 35%; background: #f9fafb; font-weight: 600; }
        table.data-table td.value { width: 65%; }

        /* Tabel daftar (list mode) */
        table.list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10pt;
            margin-top: 10px;
        }
        table.list-table th {
            background: #d1d5db;
            padding: 6px 5px;
            border: 1px solid #666;
            font-weight: bold;
            text-align: center;
            font-size: 9.5pt;
        }
        table.list-table td {
            padding: 5px;
            border: 1px solid #999;
            vertical-align: top;
        }
        table.list-table td.center { text-align: center; }

        .ebm-list { margin: 0; padding: 0; list-style: none; }
        .ebm-list li { padding: 2px 0; }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 8pt;
            font-weight: bold;
        }
        .status-disetujui { background: #d1fae5; color: #065f46; border: 1px solid #059669; }
        .status-ditolak { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }
        .status-proses { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }

        .ttd-area { margin-top: 25px; display: table; width: 100%; table-layout: fixed; }
        .ttd-box {
            display: table-cell;
            width: 33.33%;
            text-align: center;
            padding: 0 10px;
            vertical-align: top;
        }
        .ttd-box .jabatan { font-size: 10.5pt; margin-bottom: 3px; }
        .ttd-box .space { height: 60px; margin: 5px 0; }
        .ttd-box .nama { font-weight: bold; text-decoration: underline; font-size: 10.5pt; }
        .ttd-box .nip { font-size: 9pt; }

        .footer {
            margin-top: 20px;
            padding-top: 8px;
            border-top: 1px solid #999;
            font-size: 8pt;
            text-align: center;
            color: #555;
        }

        /* Page break antar form */
        .form-page { page-break-after: always; }
        .form-page:last-child { page-break-after: auto; }

        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .preview-wrapper {
                max-width: none;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }
            .section { page-break-inside: avoid; }
            .ttd-area { page-break-inside: avoid; }
        }

        .loading { text-align: center; padding: 40px; color: #666; font-family: Arial; }
    </style>
</head>
<body>

    <div class="no-print">
        <button class="btn-back" onclick="window.close()">✕ Tutup</button>
        <button class="btn-print" onclick="window.print()">🖨️ Cetak / Save PDF</button>
    </div>

    <div class="preview-wrapper" id="content">
        <div class="loading">Memuat data...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function esc(str) {
            if (str === null || str === undefined) return '-';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTanggal(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function formatRupiah(num) {
            if (!num) return '-';
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function getStatusInfo(status) {
            const map = {
                'disetujui': { label: 'DISETUJUI', cls: 'status-disetujui' },
                'ditolak': { label: 'DITOLAK', cls: 'status-ditolak' }
            };
            if (map[status]) return map[status];
            return { label: status.replace(/_/g, ' ').toUpperCase(), cls: 'status-proses' };
        }

        function kopSurat() {
            return `
                <div class="kop-surat">
                    <div class="kop-logo">LOGO<br>RSUD</div>
                    <div class="kop-text">
                        <h1>RUMAH SAKIT UMUM DAERAH</h1>
                        <h2>AJI MUHAMMAD PARIKESIT</h2>
                        <p>Jl. Raya Tenggarong, Kutai Kartanegara, Kalimantan Timur</p>
                        <p class="alamat">Telp. (0541) 123456 • Email: info@rsudamp.go.id</p>
                    </div>
                </div>
            `;
        }

        // ============ MODE 1: DAFTAR PENGAJUAN ============
        async function renderDaftar(ids) {
            const { data, error } = await supabaseClient
                .from('pengajuan')
                .select('*, pengaju:admin_ksm_id (nama_lengkap, ksm)')
                .in('id', ids);

            if (error || !data) {
                document.getElementById('content').innerHTML = '<div class="loading">Gagal memuat data.</div>';
                return;
            }

            // Urutkan sesuai urutan ids yang dikirim
            const sorted = ids.map(id => data.find(d => d.id === id)).filter(Boolean);

            let rowsHtml = '';
            sorted.forEach((item, idx) => {
                const statusInfo = getStatusInfo(item.status);
                rowsHtml += `
                    <tr>
                        <td class="center">${idx + 1}</td>
                        <td>${formatTanggal(item.tanggal_pengajuan)}</td>
                        <td><strong>${esc(item.nama_obat)}</strong></td>
                        <td>${esc(item.pengaju?.ksm || '-')}</td>
                        <td>${esc(item.pemberi_persetujuan || '-')}</td>
                        <td class="center"><span class="status-badge ${statusInfo.cls}">${statusInfo.label}</span></td>
                    </tr>
                `;
            });

            const html = `
                ${kopSurat()}
                <div class="judul-doc">
                    <h3>DAFTAR PENGAJUAN PENGADAAN OBAT REGULER</h3>
                    <div class="nomor">Total: ${sorted.length} pengajuan</div>
                </div>

                <table class="list-table">
                    <thead>
                        <tr>
                            <th style="width: 5%;">No</th>
                            <th style="width: 15%;">Tanggal</th>
                            <th style="width: 25%;">Nama Obat</th>
                            <th style="width: 20%;">KSM</th>
                            <th style="width: 20%;">Pemberi Persetujuan</th>
                            <th style="width: 15%;">Status</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>

                <div class="footer">
                    Dokumen ini dicetak dari Sistem E-Force • RSUD Aji Muhammad Parikesit<br>
                    Dicetak pada: ${new Date().toLocaleString('id-ID')}
                </div>
            `;
            document.getElementById('content').innerHTML = html;
            autoPrint();
        }

        // ============ MODE 2: FORM PENGAJUAN (multiple) ============
        async function renderForm(ids) {
            const { data, error } = await supabaseClient
                .from('pengajuan')
                .select('*, pengaju:admin_ksm_id (nama_lengkap, ksm, email)')
                .in('id', ids);

            if (error || !data) {
                document.getElementById('content').innerHTML = '<div class="loading">Gagal memuat data.</div>';
                return;
            }

            const sorted = ids.map(id => data.find(d => d.id === id)).filter(Boolean);
            
            // Fetch riwayat untuk semua ids sekaligus
            const { data: riwayatAll } = await supabaseClient
                .from('riwayat_pengajuan')
                .select('*, user:user_id (nama_lengkap, role)')
                .in('pengajuan_id', ids)
                .order('created_at', { ascending: true });

            let allFormsHtml = '';
            sorted.forEach((p, idx) => {
                const riwayat = (riwayatAll || []).filter(r => r.pengajuan_id === p.id);
                allFormsHtml += renderSingleForm(p, riwayat);
            });

            document.getElementById('content').innerHTML = allFormsHtml;
            autoPrint();
        }

        function renderSingleForm(p, riwayat) {
            const statusInfo = getStatusInfo(p.status);
            const df = p.data_farmasi || {};
            const ebmList = p.ebm_ppk || [];
            const tglPengajuan = new Date(p.tanggal_pengajuan);
            const nomorDok = `E-FORCE/${tglPengajuan.getFullYear()}/${String(tglPengajuan.getMonth()+1).padStart(2,'0')}/${p.id.substring(0, 6).toUpperCase()}`;

            const findLog = (role) => riwayat.find(r => r.role === role && r.aksi === 'approve');
            const logAdmin = riwayat.find(r => r.role === 'admin_ksm');
            const logKetuaKSM = findLog('ketua_ksm');
            const logKetuaPFT = findLog('ketua_pft');
            const logWadir = findLog('wadir');

            let ebmHtml = '-';
            if (ebmList.length > 0) {
                ebmHtml = '<ul class="ebm-list">' + ebmList.map(e => 
                    `<li>• <strong>${esc(e.tipe)}:</strong> ${esc(e.nama)}${e.link ? ` — <em>${esc(e.link)}</em>` : ''}</li>`
                ).join('') + '</ul>';
            }

            return `
                <div class="form-page">
                    ${kopSurat()}

                    <div class="judul-doc">
                        <h3>FORMULIR PENGAJUAN PENGADAAN OBAT REGULER</h3>
                        <div class="nomor">Nomor: ${nomorDok}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">A. DATA PENGAJUAN (Admin KSM)</div>
                        <table class="data-table">
                            <tr><td class="label">Tanggal Pengajuan</td><td class="value">${formatTanggal(p.tanggal_pengajuan)}</td></tr>
                            <tr><td class="label">Nama Obat</td><td class="value"><strong>${esc(p.nama_obat)}</strong></td></tr>
                            <tr><td class="label">EBM & PPK/Konsensus</td><td class="value">${ebmHtml}</td></tr>
                            <tr><td class="label">Alasan Pengajuan</td><td class="value">${esc(p.alasan_pengajuan)}</td></tr>
                            <tr><td class="label">Pemberi Persetujuan</td><td class="value">${esc(p.pemberi_persetujuan)}</td></tr>
                            <tr><td class="label">KSM Pengaju</td><td class="value">${esc(p.pengaju?.ksm || '-')}</td></tr>
                            <tr><td class="label">Diajukan Oleh</td><td class="value">${esc(logAdmin?.user?.nama_lengkap || p.pengaju?.nama_lengkap || '-')}</td></tr>
                        </table>
                    </div>

                    <div class="section">
                        <div class="section-title">B. KRITERIA RESTRIKSI (Ketua KSM)</div>
                        <table class="data-table">
                            <tr><td class="label">Kriteria Restriksi</td><td class="value">${esc(p.kriteria_restriksi || 'Belum diisi')}</td></tr>
                            ${logKetuaKSM ? `
                            <tr><td class="label">Tinjau Pengajuan</td><td class="value">${esc(logKetuaKSM.catatan)}</td></tr>
                            <tr><td class="label">Status</td><td class="value"><span class="status-badge status-disetujui">DISETUJUI</span> pada ${formatTanggal(logKetuaKSM.created_at)}</td></tr>` : ''}
                        </table>
                    </div>

                    <div class="section">
                        <div class="section-title">C. DATA FARMASI (Anggota PFT)</div>
                        <table class="data-table">
                            <tr><td class="label">Keterangan Obat</td><td class="value">${esc(df.keterangan_obat)}</td></tr>
                            <tr><td class="label">Jenis Obat</td><td class="value">${esc(df.jenis_obat)}</td></tr>
                            <tr><td class="label">Nama Obat</td><td class="value">${esc(df.nama_obat || p.nama_obat)}</td></tr>
                            <tr><td class="label">Harga Obat</td><td class="value">${formatRupiah(df.harga_obat)}</td></tr>
                            <tr><td class="label">Kategori Obat</td><td class="value">${esc(df.kategori_obat)}</td></tr>
                            <tr><td class="label">Termasuk Kronis</td><td class="value">${esc(df.is_kronis)}</td></tr>
                            <tr><td class="label">Informasi Keamanan</td><td class="value">${esc(df.info_keamanan)}</td></tr>
                            <tr><td class="label">Obat Alternatif</td><td class="value">${esc(df.obat_alternatif)}</td></tr>
                            <tr><td class="label">Harga Alternatif</td><td class="value">${formatRupiah(df.harga_alternatif)}</td></tr>
                        </table>
                    </div>

                    ${logKetuaPFT ? `
                    <div class="section">
                        <div class="section-title">D. REKOMENDASI KETUA PFT</div>
                        <table class="data-table">
                            <tr><td class="label">Rekomendasi</td><td class="value">${esc(logKetuaPFT.catatan)}</td></tr>
                            <tr><td class="label">Tanggal</td><td class="value">${formatTanggal(logKetuaPFT.created_at)}</td></tr>
                        </table>
                    </div>` : ''}

                    ${logWadir ? `
                    <div class="section">
                        <div class="section-title">E. KEPUTUSAN AKHIR (Wakil Direktur)</div>
                        <table class="data-table">
                            <tr><td class="label">Status Akhir</td><td class="value"><span class="status-badge ${statusInfo.cls}">${statusInfo.label}</span></td></tr>
                            <tr><td class="label">Rekomendasi</td><td class="value">${esc(logWadir.catatan)}</td></tr>
                            <tr><td class="label">Tanggal Keputusan</td><td class="value">${formatTanggal(logWadir.created_at)}</td></tr>
                        </table>
                    </div>` : ''}

                    <div class="ttd-area">
                        <div class="ttd-box">
                            <div class="jabatan">Diajukan oleh,<br><strong>Admin KSM</strong></div>
                            <div class="space"></div>
                            <div class="nama">${esc(logAdmin?.user?.nama_lengkap || p.pengaju?.nama_lengkap || '.......................')}</div>
                            <div class="nip">NIP. ..........................</div>
                        </div>
                        <div class="ttd-box">
                            <div class="jabatan">Direview oleh,<br><strong>Ketua KSM</strong></div>
                            <div class="space"></div>
                            <div class="nama">${esc(logKetuaKSM?.user?.nama_lengkap || '.......................')}</div>
                            <div class="nip">NIP. ..........................</div>
                        </div>
                        <div class="ttd-box">
                            <div class="jabatan">Disetujui oleh,<br><strong>Wakil Direktur</strong></div>
                            <div class="space"></div>
                            <div class="nama">${esc(logWadir?.user?.nama_lengkap || '.......................')}</div>
                            <div class="nip">NIP. ..........................</div>
                        </div>
                    </div>

                    <div class="footer">
                        Dokumen ini dicetak dari Sistem E-Force • RSUD Aji Muhammad Parikesit<br>
                        Dicetak pada: ${new Date().toLocaleString('id-ID')}
                    </div>
                </div>
            `;
        }

        function autoPrint() {
            setTimeout(() => { window.print(); }, 600);
        }

        // ============ MAIN ============
        async function load() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'form';
            const idsParam = params.get('ids');

            if (!idsParam) {
                document.getElementById('content').innerHTML = '<div class="loading">Tidak ada data yang dipilih.</div>';
                return;
            }

            const ids = idsParam.split(',').filter(id => id.trim() !== '');
            if (ids.length === 0) {
                document.getElementById('content').innerHTML = '<div class="loading">Tidak ada data yang dipilih.</div>';
                return;
            }

            if (mode === 'daftar') {
                await renderDaftar(ids);
            } else {
                await renderForm(ids);
            }
        }

        load();
    </script>
</body>
</html>
