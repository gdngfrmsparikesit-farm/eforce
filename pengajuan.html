<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Pengadaan Reguler - E-Fors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- TOM SELECT CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        .border-rsud { border-color: #059669; }
        .step-active { background-color: #059669; color: white; border-color: #059669; }
        .step-inactive { background-color: white; color: #9ca3af; border-color: #e5e7eb; }
        
        /* CUSTOMISASI TOM SELECT */
        .ts-wrapper.single .ts-control {
            background-color: #fff;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.625rem 1rem;
            font-size: 1rem;
            color: #374151;
        }
        .ts-wrapper.focus .ts-control {
            box-shadow: 0 0 0 2px #10b981;
            border-color: #10b981;
            outline: none;
        }
        .ts-dropdown {
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            font-size: 0.95rem;
            z-index: 50;
        }
        .ts-dropdown .option.active {
            background-color: #ecfdf5;
            color: #047857;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <!-- Diperlebar ke max-w-5xl agar proporsional dengan form 2 kolom -->
        <div class="w-full max-w-[95%] lg:max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-2 md:gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Container Diperlebar -->
    <main class="w-full max-w-[95%] lg:max-w-5xl mx-auto px-4 py-6 md:py-8">

        <nav class="text-sm text-gray-500 mb-3">
            <a href="dashboard.html" class="hover:text-emerald-600">🏠 Dashboard</a>
            <span class="mx-2">›</span>
            <span class="text-rsud font-medium">Ajukan Obat Baru</span>
        </nav>

        <a href="dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 border border-emerald-300 text-rsud rounded-full text-sm hover:bg-emerald-50 transition mb-6">
            <span>‹</span> Kembali
        </a>

        <!-- Progress Bar -->
        <div class="flex items-center justify-between mb-6 md:mb-8 px-4 md:px-12">
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-active">1</div>
                <span class="text-xs mt-2 text-gray-700 text-center hidden sm:block">Admin KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">2</div>
                <span class="text-xs mt-2 text-gray-500 text-center hidden sm:block">Ketua KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">3</div>
                <span class="text-xs mt-2 text-gray-500 text-center hidden sm:block">Anggota PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">4</div>
                <span class="text-xs mt-2 text-gray-500 text-center hidden sm:block">Ketua PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">5</div>
                <span class="text-xs mt-2 text-gray-500 text-center hidden sm:block">Wakil Direktur</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-emerald-200 shadow-sm p-4 md:p-8">
            <h1 class="text-xl md:text-2xl font-bold text-rsud text-center mb-6 md:mb-8">Pengajuan Pengadaan Reguler</h1>

            <!-- FORM GRID 2 KOLOM -->
            <form id="pengajuanForm" class="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-10">
                
                <!-- ================= KOLOM KIRI ================= -->
                <div class="space-y-6">
                    <!-- Tanggal Pengajuan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pengajuan <span class="text-red-500">*</span></label>
                        <input type="date" id="tanggalPengajuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>

                    <!-- Pilih Obat -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Obat (Formularium) <span class="text-red-500">*</span></label>
                        <select id="pilihObat" placeholder="Ketik nama obat untuk mencari..." required>
                            <option value="">Memuat data obat...</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">Ketik nama generik atau nama dagang (contoh: "paracetamol", "sanmol").</p>
                    </div>

                    <!-- EBM & PPK/Konsensus -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">EBM & PPK/Konsensus <span class="text-red-500">*</span></label>
                        <div id="ebmContainer" class="border border-gray-200 rounded-lg p-3 md:p-4 space-y-3 bg-gray-50"></div>
                        <button type="button" id="tambahEbmBtn" class="mt-3 bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-emerald-700 transition flex items-center gap-1">
                            <span>+</span> Tambah Baris
                        </button>
                    </div>
                </div>

                <!-- ================= KOLOM KANAN ================= -->
                <div class="space-y-6 flex flex-col h-full">
                    <!-- Alasan Pengajuan -->
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Alasan Pengajuan <span class="text-red-500">*</span></label>
                        <textarea id="alasanPengajuan" required rows="6" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none resize-none h-32 md:h-40"></textarea>
                    </div>

                    <!-- Pemberi Persetujuan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pemberi Persetujuan <span class="text-red-500">*</span></label>
                        <select id="pemberiPersetujuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            <option value="">-- Pilih Pemberi Persetujuan --</option>
                            <option value="Ketua KSM Jantung">Ketua KSM Jantung</option>
                            <option value="Ketua KSM Saraf dan Jiwa">Ketua KSM Saraf dan Jiwa</option>
                            <option value="Ketua KSM Bedah Gigi & Mulut">Ketua KSM Bedah Gigi & Mulut</option>
                            <option value="Ketua KSM Paru">Ketua KSM Paru</option>
                            <option value="Ketua KSM Kulit">Ketua KSM Kulit</option>
                            <option value="Ketua KSM Penunjang">Ketua KSM Penunjang</option>
                            <option value="Ketua KSM Umum">Ketua KSM Umum</option>
                            <option value="Ketua KSM IPD">Ketua KSM IPD</option>
                        </select>
                    </div>

                    <!-- Submit Button (Posisi di bawah kanan) -->
                    <div class="pt-4 mt-auto">
                        <button type="submit" id="submitBtn" class="w-full bg-rsud text-white font-semibold py-3.5 rounded-xl hover:bg-emerald-700 transition shadow-md text-lg">
                            Kirim Pengajuan
                        </button>
                    </div>
                </div>

                <!-- Error Message (Membentang di bawah jika ada error) -->
                <div class="lg:col-span-2">
                    <p id="errorMsg" class="text-red-500 text-sm text-center hidden font-semibold bg-red-50 p-3 rounded-lg border border-red-200"></p>
                </div>
            </form>
        </div>
    </main>

    <script src="js/emailHelper.js"></script>
    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1ia1Sofbm9IFgO3cQbeiPw_KNslUtii';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserProfile = null;
        let tomSelectInstance = null;

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabaseClient.from('users').select('*').eq('id', session.user.id).single();
            currentUserProfile = profile;
            
            document.getElementById('tanggalPengajuan').valueAsDate = new Date();
            tambahBarisEbm();
            loadMasterObat(); 
        }

        async function loadMasterObat() {
            const select = document.getElementById('pilihObat');
            
            const { data, error } = await supabaseClient
                .from('master_obat')
                .select('id, nama_generik, nama_dagang, bentuk_sediaan, kekuatan_dosis')
                .eq('is_active', true)
                .order('nama_generik', { ascending: true });

            if (error) {
                select.innerHTML = `<option value="">Gagal memuat obat: ${error.message}</option>`;
                return;
            }

            if (data.length === 0) {
                select.innerHTML = `<option value="">Belum ada data obat di Formularium</option>`;
                return;
            }

            select.innerHTML = '<option value="">-- Ketik / Pilih Obat --</option>' + data.map(obat => {
                let label = obat.nama_generik;
                if (obat.nama_dagang) label += ` (${obat.nama_dagang})`;
                label += ` - ${obat.bentuk_sediaan} ${obat.kekuatan_dosis || ''}`;
                return `<option value="${obat.id}" data-nama="${obat.nama_generik}">${label}</option>`;
            }).join('');

            tomSelectInstance = new TomSelect("#pilihObat", {
                create: false,
                sortField: { field: "text", direction: "asc" },
                maxOptions: 50,
                placeholder: "Ketik nama obat...",
                dropdownParent: 'body' // Mencegah dropdown terpotong oleh overflow form
            });
        }

        function tambahBarisEbm() {
            const container = document.getElementById('ebmContainer');
            const row = document.createElement('div');
            row.className = 'ebm-row flex flex-col gap-2 relative border-b border-gray-200 pb-3 mb-3 last:border-0 last:pb-0 last:mb-0';
            row.innerHTML = `
                <div class="flex gap-2">
                    <select class="ebm-tipe px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none w-1/3">
                        <option value="EBM">EBM</option>
                        <option value="PPK">PPK</option>
                        <option value="Konsensus">Konsensus</option>
                    </select>
                    <input type="text" class="ebm-nama flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Nama (contoh: EBM Vita)">
                </div>
                <div class="flex gap-2 items-center">
                    <input type="text" class="ebm-link flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Link (opsional)">
                    <button type="button" class="hapus-ebm text-red-500 hover:text-red-700 p-2 bg-red-50 rounded-lg" title="Hapus">🗑</button>
                </div>
            `;
            row.querySelector('.hapus-ebm').addEventListener('click', () => {
                if (container.querySelectorAll('.ebm-row').length > 1) row.remove();
                else alert('Minimal harus ada 1 baris EBM/PPK.');
            });
            container.appendChild(row);
        }

        document.getElementById('tambahEbmBtn').addEventListener('click', tambahBarisEbm);

        document.getElementById('pengajuanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.textContent = 'Mengirim...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const ebmRows = document.querySelectorAll('.ebm-row');
            const ebmData = [];
            ebmRows.forEach(row => {
                const tipe = row.querySelector('.ebm-tipe').value;
                const nama = row.querySelector('.ebm-nama').value.trim();
                const link = row.querySelector('.ebm-link').value.trim();
                if (nama) ebmData.push({ tipe, nama, link });
            });

            if (ebmData.length === 0) {
                errorMsg.textContent = 'Minimal isi 1 nama EBM/PPK/Konsensus.';
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Kirim Pengajuan';
                btn.disabled = false;
                return;
            }

            const selectedObatId = tomSelectInstance.getValue();
            
            if (!selectedObatId) {
                errorMsg.textContent = 'Silakan pilih obat dari daftar formularium.';
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Kirim Pengajuan';
                btn.disabled = false;
                return;
            }

            const selectedObatNama = tomSelectInstance.getOption(selectedObatId).dataset.nama;

            const payload = {
                p_tanggal: document.getElementById('tanggalPengajuan').value,
                p_nama_obat: selectedObatNama,
                p_master_obat_id: selectedObatId,
                p_ebm_ppk: ebmData,
                p_alasan: document.getElementById('alasanPengajuan').value,
                p_pemberi_persetujuan: document.getElementById('pemberiPersetujuan').value
            };

            const { data, error } = await supabaseClient.rpc('submit_pengajuan', payload);

            if (error) {
                errorMsg.textContent = 'Gagal submit: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Kirim Pengajuan';
                btn.disabled = false;
                return;
            }

            alert('Pengajuan berhasil dikirim!');
            
            try {
                if (typeof sendEmailNotif === 'function') {
                    await sendEmailNotif(
                        'ketua_ksm',
                        {
                            id: data,
                            nama_obat: payload.p_nama_obat,
                            pengaju: currentUserProfile
                        },
                        'Menunggu Persetujuan',
                        'Pengajuan baru menunggu review Anda',
                        supabaseClient
                    );
                }
            } catch (emailErr) {
                console.error('Email gagal:', emailErr);
            }
            
            window.location.href = 'dashboard.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        checkAuth();
    </script>
</body>
</html>
