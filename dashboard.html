<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        .border-rsud { border-color: #059669; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .skeleton { animation: pulse-slow 1.5s ease-in-out infinite; }
        .stat-card { transition: all 0.2s ease; border: 3px solid transparent; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-card.active { border-color: #065f46; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(5,150,105,0.4); }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm border-b flex-shrink-0 z-20">
        <div class="w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 py-3 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-2 md:gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden">
        
        <div class="flex-shrink-0 w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pt-4 md:pt-5">
            <nav class="text-sm text-gray-500 mb-2">
                <span class="text-rsud font-medium">🏠 Dashboard</span>
            </nav>

            <h1 id="greeting" class="text-lg md:text-xl font-bold text-gray-800 mb-4">Halo, Memuat data...</h1>

            <!-- Stat Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-4">
                <button data-tab="tugas-saya" class="stat-card bg-rsud text-white rounded-xl p-3 md:p-4 text-left active">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xl md:text-2xl">📌</span>
                        <span class="text-[10px] md:text-xs font-medium bg-white/20 px-2 py-1 rounded-full">Fokus</span>
                    </div>
                    <div class="text-xl md:text-2xl font-bold" id="countTugasSaya">-</div>
                    <div class="text-[10px] md:text-xs opacity-90 mt-1">Tugas Saya</div>
                </button>
                <button data-tab="semua" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">📋</span></div>
                    <div class="text-xl md:text-2xl font-bold text-gray-800" id="countSemua">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Semua Pengajuan</div>
                </button>
                <button data-tab="disetujui" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">✅</span></div>
                    <div class="text-xl md:text-2xl font-bold text-green-600" id="countDisetujui">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Disetujui</div>
                </button>
                <button data-tab="ditolak" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">❌</span></div>
                    <div class="text-xl md:text-2xl font-bold text-red-600" id="countDitolak">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Ditolak</div>
                </button>
            </div>

            <!-- Filter Box -->
            <div class="bg-rsud rounded-xl p-3 md:p-5 mb-4 shadow-md">
                <h2 class="text-lg md:text-xl font-bold text-white mb-3">Daftar Pengajuan Obat</h2>
                <div class="mb-3">
                    <input type="text" id="searchObat" placeholder="🔍 Cari Nama Obat..." class="w-full px-4 py-2 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none text-sm">
                </div>
                <!-- Grid 1 di HP, 2 di Tablet, 4 di Desktop -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-white mb-1">Dari Tanggal</label>
                        <input type="date" id="dariTanggal" class="w-full px-3 py-1.5 rounded-lg border-none text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Sampai Tanggal</label>
                        <input type="date" id="sampaiTanggal" class="w-full px-3 py-1.5 rounded-lg border-none text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Tipe Pengajuan</label>
                        <select id="tipePengajuan" class="w-full px-3 py-1.5 rounded-lg border-none bg-white text-sm outline-none">
                            <option value="">Semua</option>
                            <option value="reguler">Reguler</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Ketua KSM</label>
                        <select id="filterKsm" class="w-full px-3 py-1.5 rounded-lg border-none bg-white text-sm outline-none">
                            <option value="">Semua</option>
                            <option value="Anak-Jtg-Saraf-Gilut">Anak-Jtg-Saraf-Gilut</option>
                            <option value="Jantung">Jantung</option>
                            <option value="Syaraf dan Jiwa">Syaraf dan Jiwa</option>
                            <option value="Bedah Gigi & Mulut">Bedah Gigi & Mulut</option>
                            <option value="Paru">Paru</option>
                            <option value="Kulit">Kulit</option>
                            <option value="Penunjang">Penunjang</option>
                            <option value="Umum">Umum</option>
                            <option value="IPD">IPD</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-2">
                    <button id="resetFilter" class="text-white text-xs hover:underline">Reset Filter</button>
                    <button id="searchBtn" class="bg-white text-rsud px-5 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">Search</button>
                </div>
            </div>

            <!-- Tombol Aksi (Menumpuk di HP) -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-2">
                <button id="ajukanBtn" class="w-full sm:w-auto bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex justify-center items-center gap-2">
                    <span>+</span> Ajukan Obat Baru
                </button>
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                    <button id="printBtn" class="w-full sm:w-auto bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex justify-center items-center gap-2">
                        <span>🖨️</span> Cetak PDF
                    </button>
                    <button id="exportBtn" class="w-full sm:w-auto bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex justify-center items-center gap-2">
                        <span>⬇</span> Download Excel
                    </button>
                </div>
            </div>

            <div id="infoJumlah" class="text-xs text-gray-500 mb-2"></div>
        </div>

        <!-- Area Tabel (Bisa di-scroll horizontal di HP) -->
        <div id="tableScroll" class="flex-1 overflow-y-auto w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pb-2">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead class="sticky top-0 z-10 bg-gray-50 shadow-sm">
                        <tr class="text-gray-600 text-xs uppercase tracking-wider whitespace-nowrap">
                            <th class="p-3 font-semibold">No</th>
                            <th class="p-3 font-semibold">Tanggal</th>
                            <th class="p-3 font-semibold">Nama Obat</th>
                            <th class="p-3 font-semibold">KSM</th>
                            <th class="p-3 font-semibold">Status</th>
                            <th class="p-3 font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

        <div class="flex-shrink-0 w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pb-4">
            <div id="pagination" class="mt-3"></div>
        </div>
    </main>

    <!-- ... SISA KODE JAVASCRIPT TETAP SAMA SEPERTI SEBELUMNYA ... -->
    <!-- (Salin script Javascript dari file dashboard.html Anda yang sebelumnya ke sini) -->
    
</body>
</html>
