<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Force RSUD Aji Muhammad Parikesit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-rsud { background-color: #d97746; }
        .text-rsud { color: #d97746; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <!-- Logo RSUD -->
        <div class="flex justify-center mb-6">
            <img src="https://via.placeholder.com/150x50?text=RSUD+AMP" alt="Logo RSUD" class="h-12">
        </div>
        
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">E-Force</h1>
        <p class="text-center text-gray-500 mb-8 text-sm">Sistem Pengajuan Pengadaan Obat Reguler</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" placeholder="admin@rsud.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-rsud text-white font-semibold py-2.5 rounded-lg hover:bg-orange-700 transition duration-200">
                Masuk
            </button>
        </form>
        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

    <script>
        // GANTI DENGAN URL DAN ANON KEY DARI SUPABASE ANDA
        const SUPABASE_URL = 'https://xxxxxx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.textContent = 'Memproses...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = 'Login gagal: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Masuk';
                btn.disabled = false;
            } else {
                // Redirect ke dashboard
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
