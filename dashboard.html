<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .bg-rsud-dark { background-color: #047857; }
        .text-rsud { color: #059669; }
        .border-rsud { border-color: #059669; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .skeleton { animation: pulse-slow 1.5s ease-in-out infinite; }
        .stat-card { transition: all 0.2s ease; border: 3px solid transparent; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-card.active { border-color: #065f46; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(5,150,105,0.4); }
        
        /* Custom scrollbar untuk area tabel */
        #tableScroll::-webkit-scrollbar { width: 8px; }
        #tableScroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        #tableScroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        #tableScroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden">

    <!-- HEADER (Fixed) -->
    <header class="bg-white shadow-sm border-b flex-shrink-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            </div>
            <div class="flex items-center gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- MAIN (Flex Column) -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- ====== FIXED TOP SECTION ====== -->
        <div class="flex-shrink-0 max-w-7xl mx-auto w-full px-4 pt-5">
            
            <nav class="text-sm text-gray-500 mb-2">
                <span class="text-rsud font-medium">🏠 Dashboard</span>
            </nav>

            <h1 id="greeting" class="text-xl font-bold text-gray-800 mb-4">Halo, Memuat data...</h1>

            <!-- Stat Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <button data-tab="tugas-saya" class="stat-card bg-rsud text-white rounded-xl p-4 text-left active">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-2xl">📌</span>
                        <span class="text-xs font-medium bg-white/20 px-2 py-1 rounded-full">Fokus</span>
                    </div>
                    <div class="text-2xl font-bold" id="countTugasSaya">-</div>
                    <div class="text-xs opacity-90 mt-1">Tugas Saya</div>
                </button>

                <button data-tab="semua" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-4 text-left">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-2xl">📋</span>
                    </div>
                    <div class="text-2xl font-bold text-gray-800" id="countSemua">-</div>
                    <div class="text-xs text-gray-500 mt-1">Semua Pengajuan</div>
                </button>

                <button data-tab="disetujui" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-4 text-left">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-2xl">✅</span>
                    </div>
                    <div class="text-2xl font-bold text-green-600" id="countDisetujui">-</div>
                    <div class="text-xs text-gray-500 mt-1">Disetujui</div>
                </button>

                <button data-tab="ditolak" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-4 text-left">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-2xl">❌</span>
                    </div>
                    <div class="text-2xl font-bold text-red-600" id="countDitolak">-</div>
                    <div class="text-xs text-gray-500 mt-1">Ditolak</div>
                </button>
            </div>

            <!-- Filter Box -->
            <div class="bg-rsud rounded-xl p-5 mb-4 shadow-md">
                <h2 class="text-xl font-bold text-white mb-3">Daftar Pengajuan Obat</h2>
                
                <div class="mb-3">
                    <input type="text" id="searchObat" placeholder="🔍 Cari Nama Obat..." class="w-full px-4 py-2 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-white mb-1">Dari Tanggal</label>
                        <input type="date" id="dariTanggal" class="w-full px-3 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Sampai Tanggal</label>
                        <input type="date" id="sampaiTanggal" class="w-full px-3 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Tipe Pengajuan</label>
                        <select id="tipePengajuan" class="w-full px-3 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none bg-white text-sm">
                            <option value="">Semua</option>
                            <option value="reguler">Reguler</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-white mb-1">Ketua KSM</label>
                        <select id="filterKsm" class="w-full px-3 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-emerald-300 outline-none bg-white text-sm">
                            <option value="">Semua</option>
                            <option value="Anak-Jtg-Saraf-Gilut">Anak-Jtg-Saraf-Gilut</option>
                            <option value="Jantung">Jantung</option>
                            <option value="Syaraf dan Jiwa">Syaraf dan Jiwa</option>
                            <option value="Bedah Gigi & Mulut">Bedah Gigi & Mulut</option>
                            <option value="Paru">Paru</option>
                            <option value="Kulit">Kulit</option>
                            <option value="Penunjang">Penunjang</option>
                            <option value="Umum">Umum</option>
                            <option value="IPD">IPD</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button id="resetFilter" class="text-white text-xs hover:underline">Reset Filter</button>
                    <button id="searchBtn" class="bg-white text-rsud px-5 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">Search</button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between items-center mb-2">
                <button id="ajukanBtn" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex items-center gap-2">
                    <span>+</span> Ajukan Obat Baru
                </button>
                <div class="flex gap-2">
                    <button id="printBtn" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex items-center gap-2">
                        <span>🖨️</span> Cetak PDF (F4)
                    </button>
                    <button id="exportBtn" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex items-center gap-2">
                        <span>⬇</span> Download Excel
                    </button>
                </div>
            </div>

            <div id="infoJumlah" class="text-xs text-gray-500 mb-2"></div>

        </div>
        <!-- /END FIXED TOP SECTION -->

        <!-- ====== SCROLLABLE TABLE AREA ====== -->
        <div id="tableScroll" class="flex-1 overflow-y-auto max-w-7xl mx-auto w-full px-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 z-10 bg-gray-50 shadow-sm">
                        <tr class="text-gray-600 text-xs uppercase tracking-wider">
                            <th class="p-3 font-semibold">No</th>
                            <th class="p-3 font-semibold">Tanggal</th>
                            <th class="p-3 font-semibold">Nama Obat</th>
                            <th class="p-3 font-semibold">KSM</th>
                            <th class="p-3 font-semibold">Status</th>
                            <th class="p-3 font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
        <!-- /END SCROLLABLE TABLE -->

        <!-- ====== FIXED PAGINATION ====== -->
        <div class="flex-shrink-0 max-w-7xl mx-auto w-full px-4 pb-4">
            <div id="pagination" class="mt-3"></div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allPengajuan = [];
        let filteredPengajuan = [];
        let activeTab = 'tugas-saya';
        let currentPage = 1;
        const PER_PAGE = 10;

        // ====== UTIL: Relative Time ======
        function relativeTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffSec = Math.floor((now - date) / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            if (diffSec < 60) return 'baru saja';
            if (diffMin < 60) return `${diffMin} menit lalu`;
            if (diffHour < 24) return `${diffHour} jam lalu`;
            if (diffDay < 7) return `${diffDay} hari lalu`;
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // ====== UTIL: Status Badge ======
        function getStatusBadge(status) {
            const map = {
                'draft':                { label: 'Draft', icon: '📝', cls: 'bg-gray-100 text-gray-700' },
                'menunggu_ketua_ksm':   { label: 'Menunggu Ketua KSM', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_anggota_pft': { label: 'Menunggu Anggota PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_ketua_pft':   { label: 'Menunggu Ketua PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_wadir':       { label: 'Menunggu Wadir', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'disetujui':            { label: 'Disetujui', icon: '✅', cls: 'bg-green-100 text-green-700' },
                'ditolak':              { label: 'Ditolak', icon: '❌', cls: 'bg-red-100 text-red-700' }
            };
            const item = map[status] || { label: status, icon: '•', cls: 'bg-gray-100 text-gray-700' };
            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold inline-flex items-center gap-1 ${item.cls}">
                <span>${item.icon}</span> ${item.label}
            </span>`;
        }

        // ====== UTIL: Cek Tugas User ======
        function isMyTask(item) {
            if (!currentUser) return false;
            const role = currentUser.role;
            const status = item.status;
            const taskMap = {
                'ketua_ksm':   'menunggu_ketua_ksm',
                'anggota_pft': 'menunggu_anggota_pft',
                'ketua_pft':   'menunggu_ketua_pft',
                'wadir':       'menunggu_wadir'
            };
            if (role === 'admin_ksm') {
                return item.admin_ksm_id === currentUser.id && !['disetujui', 'ditolak'].includes(status);
            }
            return status === taskMap[role];
        }

        // ====== CEK AUTH ======
        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }
            const { data: profile } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', session.user.id)
                .single();
            if (profile) {
                currentUser = profile;
                document.getElementById('greeting').textContent = `Halo, ${profile.nama_lengkap} (${profile.role.replace(/_/g, ' ').toUpperCase()})`;
                if (profile.role !== 'admin_ksm') {
                    document.getElementById('ajukanBtn').style.display = 'none';
                }
            }
            renderSkeleton();
            fetchPengajuan();
        }

        // ====== SKELETON ======
        function renderSkeleton() {
            const tbody = document.getElementById('tableBody');
            let rows = '';
            for (let i = 0; i < 5; i++) {
                rows += `<tr>
                    <td class="p-3"><div class="h-4 w-8 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-24 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-32 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-20 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-6 w-28 bg-gray-200 rounded-full skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-12 bg-gray-200 rounded skeleton"></div></td>
                </tr>`;
            }
            tbody.innerHTML = rows;
        }

        // ====== FETCH DATA ======
        async function fetchPengajuan() {
            const tbody = document.getElementById('tableBody');
            const { data, error } = await supabaseClient
                .from('pengajuan')
                .select(`*, pengaju:admin_ksm_id (nama_lengkap, ksm)`)
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }
            allPengajuan = data;
            updateStatCards();
            applyTabFilter();
        }

        function updateStatCards() {
            const total = allPengajuan.length;
            const disetujui = allPengajuan.filter(p => p.status === 'disetujui').length;
            const ditolak = allPengajuan.filter(p => p.status === 'ditolak').length;
            const tugasSaya = allPengajuan.filter(isMyTask).length;
            document.getElementById('countTugasSaya').textContent = tugasSaya;
            document.getElementById('countSemua').textContent = total;
            document.getElementById('countDisetujui').textContent = disetujui;
            document.getElementById('countDitolak').textContent = ditolak;
        }

        // ====== FILTER TAB ======
        function applyTabFilter() {
            let base = [...allPengajuan];
            if (activeTab === 'tugas-saya') base = base.filter(isMyTask);
            else if (activeTab === 'disetujui') base = base.filter(p => p.status === 'disetujui');
            else if (activeTab === 'ditolak') base = base.filter(p => p.status === 'ditolak');
            applyFormFilter(base);
        }

        // ====== FILTER FORM ======
        function applyFormFilter(baseData) {
            const namaObat = document.getElementById('searchObat').value.toLowerCase().trim();
            const dari = document.getElementById('dariTanggal').value;
            const sampai = document.getElementById('sampaiTanggal').value;
            const ksm = document.getElementById('filterKsm').value;

            filteredPengajuan = baseData.filter(item => {
                if (namaObat && !item.nama_obat.toLowerCase().includes(namaObat)) return false;
                const tgl = item.tanggal_pengajuan;
                if (dari && tgl < dari) return false;
                if (sampai && tgl > sampai) return false;
                if (ksm && item.pengaju?.ksm !== ksm) return false;
                return true;
            });
            
            // Reset ke halaman 1 setiap kali filter berubah
            currentPage = 1;
            renderTable();
        }

        // ====== RENDER TABLE (dengan pagination) ======
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const infoJumlah = document.getElementById('infoJumlah');
            
            if (filteredPengajuan.length === 0) {
                const emptyMsg = activeTab === 'tugas-saya' 
                    ? '🎉 Tidak ada tugas untuk Anda saat ini. Kerja bagus!'
                    : 'Tidak ada data yang cocok dengan filter.';
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">${emptyMsg}</td></tr>`;
                infoJumlah.textContent = `Menampilkan 0 data`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filteredPengajuan.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            const startIdx = (currentPage - 1) * PER_PAGE;
            const endIdx = startIdx + PER_PAGE;
            const pageData = filteredPengajuan.slice(startIdx, endIdx);

            tbody.innerHTML = pageData.map((item, idx) => {
                const globalIdx = startIdx + idx;
                const highlight = isMyTask(item);
                const rowClass = highlight ? 'bg-yellow-50 border-l-4 border-yellow-400 hover:bg-yellow-100' : 'hover:bg-gray-50';
                return `
                    <tr class="${rowClass} transition">
                        <td class="p-3">${globalIdx + 1}</td>
                        <td class="p-3">
                            <div class="font-medium">${relativeTime(item.tanggal_pengajuan)}</div>
                            <div class="text-xs text-gray-400">${new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID')}</div>
                        </td>
                        <td class="p-3 font-medium">${item.nama_obat}</td>
                        <td class="p-3">${item.pengaju?.ksm || '-'}</td>
                        <td class="p-3">${getStatusBadge(item.status)}</td>
                        <td class="p-3">
                            <button class="text-rsud hover:underline text-sm font-medium" onclick="lihatDetail('${item.id}')">
                                ${highlight ? '👉 Proses' : 'Lihat'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            const tabLabel = { 'tugas-saya': 'Tugas Saya', 'semua': 'Semua Pengajuan', 'disetujui': 'Disetujui', 'ditolak': 'Ditolak' }[activeTab];
            infoJumlah.textContent = `Menampilkan ${startIdx + 1}-${Math.min(endIdx, filteredPengajuan.length)} dari ${filteredPengajuan.length} data di "${tabLabel}"`;
            
            renderPagination(totalPages);
        }

        // ====== RENDER PAGINATION ======
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<div class="flex items-center justify-center gap-1 flex-wrap">';
            
            // Prev
            const prevDisabled = currentPage === 1;
            html += `<button onclick="goToPage(${currentPage - 1})" ${prevDisabled ? 'disabled' : ''} 
                class="px-3 py-1.5 rounded-lg text-sm font-medium border ${prevDisabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">
                ‹ Prev
            </button>`;
            
            // Page numbers (dengan ellipsis jika banyak)
            for (let i = 1; i <= totalPages; i++) {
                if (totalPages > 7) {
                    if (i !== 1 && i !== totalPages && Math.abs(i - currentPage) > 1) {
                        if (i === 2 || i === totalPages - 1) {
                            html += `<span class="px-2 text-gray-400">...</span>`;
                        }
                        continue;
                    }
                }
                const active = i === currentPage;
                html += `<button onclick="goToPage(${i})" 
                    class="px-3 py-1.5 rounded-lg text-sm font-medium border ${active ? 'bg-rsud text-white border-rsud' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">
                    ${i}
                </button>`;
            }
            
            // Next
            const nextDisabled = currentPage === totalPages;
            html += `<button onclick="goToPage(${currentPage + 1})" ${nextDisabled ? 'disabled' : ''} 
                class="px-3 py-1.5 rounded-lg text-sm font-medium border ${nextDisabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">
                Next ›
            </button>`;
            
            html += '</div>';
            container.innerHTML = html;
        }

        // ====== GO TO PAGE ======
        function goToPage(page) {
            const totalPages = Math.ceil(filteredPengajuan.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            // Scroll tabel ke atas
            document.getElementById('tableScroll').scrollTop = 0;
        }

        // ====== SWITCH TAB ======
        function switchTab(tabName) {
            activeTab = tabName;
            currentPage = 1;
            document.querySelectorAll('.stat-card').forEach(card => {
                if (card.dataset.tab === tabName) {
                    card.classList.add('active');
                    if (tabName === 'tugas-saya') {
                        card.classList.add('bg-rsud', 'text-white');
                        card.classList.remove('bg-white', 'text-gray-700');
                    }
                } else {
                    card.classList.remove('active');
                }
            });
            applyTabFilter();
        }

        // ====== RESET FILTER ======
        function resetFilter() {
            document.getElementById('searchObat').value = '';
            document.getElementById('dariTanggal').value = '';
            document.getElementById('sampaiTanggal').value = '';
            document.getElementById('tipePengajuan').value = '';
            document.getElementById('filterKsm').value = '';
            currentPage = 1;
            applyTabFilter();
        }

        // ====== EXPORT EXCEL (semua hasil filter, bukan hanya halaman aktif) ======
        function exportExcel() {
            if (filteredPengajuan.length === 0) {
                alert('Tidak ada data untuk diekspor.');
                return;
            }
            const dataExcel = filteredPengajuan.map((item, index) => ({
                'No': index + 1,
                'Tanggal Pengajuan': new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID'),
                'Nama Obat': item.nama_obat,
                'KSM': item.pengaju?.ksm || '-',
                'Pemberi Persetujuan': item.pemberi_persetujuan || '-',
                'Alasan Pengajuan': item.alasan_pengajuan || '-',
                'Status': item.status.replace(/_/g, ' ').toUpperCase(),
                'Tanggal Dibuat': new Date(item.created_at).toLocaleString('id-ID')
            }));
            const ws = XLSX.utils.json_to_sheet(dataExcel);
            ws['!cols'] = [{ wch: 5 }, { wch: 15 }, { wch: 25 }, { wch: 20 }, { wch: 25 }, { wch: 40 }, { wch: 20 }, { wch: 20 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Pengajuan Obat');
            const today = new Date();
            const fileName = `pengajuan-obat-${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // ====== PRINT PDF ======
        function printPengajuan() {
            if (filteredPengajuan.length === 0) {
                alert('Tidak ada data untuk dicetak.');
                return;
            }
            if (filteredPengajuan.length > 1) {
                const pilihan = confirm(`Ada ${filteredPengajuan.length} data. Cetak data pertama (${filteredPengajuan[0].nama_obat})?`);
                if (!pilihan) return;
            }
            window.open('cetak.html?id=' + filteredPengajuan[0].id, '_blank');
        }

        // ====== EVENT LISTENERS ======
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });
        document.getElementById('ajukanBtn').addEventListener('click', () => { window.location.href = 'pengajuan.html'; });
        document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; applyTabFilter(); });
        document.getElementById('resetFilter').addEventListener('click', resetFilter);
        document.getElementById('exportBtn').addEventListener('click', exportExcel);
        document.getElementById('printBtn').addEventListener('click', printPengajuan);
        document.getElementById('searchObat').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); currentPage = 1; applyTabFilter(); }
        });
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => switchTab(card.dataset.tab));
        });

        function lihatDetail(id) {
            window.location.href = 'detail.html?id=' + id;
        }

        checkAuth();
    </script>
</body>
</html>
