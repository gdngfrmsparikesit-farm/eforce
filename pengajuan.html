<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Pengadaan Reguler - E-Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        .border-rsud { border-color: #059669; }
        .step-active { background-color: #059669; color: white; border-color: #059669; }
        .step-inactive { background-color: white; color: #9ca3af; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="w-full max-w-[95%] lg:max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-2 md:gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[95%] lg:max-w-4xl mx-auto px-4 py-6 md:py-8">

        <nav class="text-sm text-gray-500 mb-3">
            <a href="dashboard.html" class="hover:text-emerald-600">🏠 Dashboard</a>
            <span class="mx-2">›</span>
            <span class="text-rsud font-medium">Ajukan Obat Baru</span>
        </nav>

        <a href="dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 border border-emerald-300 text-rsud rounded-full text-sm hover:bg-emerald-50 transition mb-6">
            <span>‹</span> Kembali
        </a>

        <!-- Progress Bar (Disembunyikan teksnya di HP) -->
        <div class="flex items-center justify-between mb-6 md:mb-8 px-1 md:px-4">
            <div class="flex flex-col items-center flex-1">
                <div class="w-8 h-8 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-active">1</div>
                <span class="text-[10px] md:text-xs mt-1 md:mt-2 text-gray-700 text-center hidden sm:block">Admin KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-8 h-8 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">2</div>
                <span class="text-[10px] md:text-xs mt-1 md:mt-2 text-gray-500 text-center hidden sm:block">Ketua KSM</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-8 h-8 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">3</div>
                <span class="text-[10px] md:text-xs mt-1 md:mt-2 text-gray-500 text-center hidden sm:block">Anggota PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-8 h-8 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">4</div>
                <span class="text-[10px] md:text-xs mt-1 md:mt-2 text-gray-500 text-center hidden sm:block">Ketua PFT</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-300 -mt-4 md:-mt-6"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="w-8 h-8 md:w-12 md:h-12 text-sm md:text-base rounded-full border-2 flex items-center justify-center font-bold step-inactive">5</div>
                <span class="text-[10px] md:text-xs mt-1 md:mt-2 text-gray-500 text-center hidden sm:block">Wakil Direktur</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-emerald-200 shadow-sm p-4 md:p-8">
            <h1 class="text-xl md:text-2xl font-bold text-rsud text-center mb-6 md:mb-8">Pengajuan Pengadaan Reguler</h1>

            <form id="pengajuanForm" class="space-y-5 md:space-y-6">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pengajuan <span class="text-red-500">*</span></label>
                    <input type="date" id="tanggalPengajuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Obat <span class="text-red-500">*</span></label>
                    <input type="text" id="namaObat" required placeholder="Contoh: Vitamin" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">EBM & PPK/Konsensus <span class="text-red-500">*</span></label>
                    <div id="ebmContainer" class="border border-gray-200 rounded-lg p-3 md:p-4 space-y-3 bg-gray-50"></div>
                    <button type="button" id="tambahEbmBtn" class="mt-3 bg-rsud text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-emerald-700 transition flex items-center gap-1">
                        <span>+</span> Tambah Baru
                    </button>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alasan Pengajuan <span class="text-red-500">*</span></label>
                    <textarea id="alasanPengajuan" required rows="4" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pemberi Persetujuan <span class="text-red-500">*</span></label>
                    <select id="pemberiPersetujuan" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                        <option value="">-- Pilih Pemberi Persetujuan --</option>
                        <option value="Ketua KSM Jantung">Ketua KSM Jantung</option>
                        <option value="Ketua KSM Saraf dan Jiwa">Ketua KSM Saraf dan Jiwa</option>
                        <option value="Ketua KSM Bedah Gigi & Mulut">Ketua KSM Bedah Gigi & Mulut</option>
                        <option value="Ketua KSM Paru">Ketua KSM Paru</option>
                        <option value="Ketua KSM Kulit">Ketua KSM Kulit</option>
                        <option value="Ketua KSM Penunjang">Ketua KSM Penunjang</option>
                        <option value="Ketua KSM Umum">Ketua KSM Umum</option>
                        <option value="Ketua KSM IPD">Ketua KSM IPD</option>
                    </select>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-rsud text-white font-semibold py-3 rounded-full hover:bg-emerald-700 transition">Submit</button>
                </div>
                <p id="errorMsg" class="text-red-500 text-sm text-center hidden"></p>
            </form>
        </div>
    </main>

    <!-- (Salin seluruh isi script Javascript dari file pengajuan.html Anda yang sebelumnya ke sini, TIDAK ADA yang perlu diubah pada logikanya) -->

</body>
</html>
