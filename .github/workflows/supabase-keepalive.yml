        run: |
          curl -X GET "${{ https://liyjnpjawjkobopwuhnb.supabase.co/ }}/rest/v1/keepalive?select=*&limit=1" \
          -H "apikey: ${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeWpucGphd2prb2JvcHd1aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk5MTMsImV4cCI6MjEwNTIwNTkxM30.xAZRyHQQf2c1jYOIlcUpy_XnwScwSdg6bs8on7_t1Nw }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
