<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - E-Fors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .bg-rsud { background-color: #059669; }
        .text-rsud { color: #059669; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .skeleton { animation: pulse-slow 1.5s ease-in-out infinite; }
        .stat-card { transition: all 0.2s ease; border: 3px solid transparent; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-card.active { border-color: #065f46; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(5,150,105,0.4); }
        
        /* Custom scrollbar hanya untuk desktop */
        @media (min-width: 768px) {
            #tableScroll::-webkit-scrollbar { width: 8px; }
            #tableScroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
            #tableScroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
            #tableScroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col md:h-screen md:overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-20 flex-shrink-0">
    <div class="w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 py-2 flex justify-between items-center">
            <div class="h-10 w-32 bg-gray-200 rounded flex items-center justify-center text-gray-500 text-xs font-semibold">RSUD AMP</div>
            <div class="flex items-center gap-2 md:gap-3">
                <a href="panduan.html" class="bg-rsud text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-emerald-700 transition">Cara Penggunaan</a>
                <button id="logoutBtn" class="bg-red-500 text-white px-3 md:px-4 py-2 rounded-full text-xs md:text-sm font-medium hover:bg-red-600 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:overflow-hidden">
        
        <!-- Bagian Atas (Filter, Stat, Tombol) -->
        <div class="flex-shrink-0 w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pt-4 md:pt-5">
            <nav class="text-sm text-gray-500 mb-2">
                <span class="text-rsud font-medium">🏠 Dashboard</span>
            </nav>

            <h1 id="greeting" class="text-lg md:text-xl font-bold text-gray-800 mb-4">Halo, Memuat data...</h1>

            <!-- Stat Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-4">
                <button data-tab="tugas-saya" class="stat-card bg-rsud text-white rounded-lg p-2 md:p-3 text-left active">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xl md:text-2xl">📌</span>
                        <span class="text-[10px] md:text-xs font-medium bg-white/20 px-2 py-1 rounded-full">Fokus</span>
                    </div>
                    <div class="text-xl md:text-2xl font-bold" id="countTugasSaya">-</div>
                    <div class="text-[10px] md:text-xs opacity-90 mt-1">Tugas Saya</div>
                </button>
                <button data-tab="semua" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">📋</span></div>
                    <div class="text-xl md:text-2xl font-bold text-gray-800" id="countSemua">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Semua Pengajuan</div>
                </button>
                <button data-tab="disetujui" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">✅</span></div>
                    <div class="text-xl md:text-2xl font-bold text-green-600" id="countDisetujui">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Disetujui</div>
                </button>
                <button data-tab="ditolak" class="stat-card bg-white border border-gray-200 text-gray-700 rounded-xl p-3 md:p-4 text-left">
                    <div class="flex items-center justify-between mb-1"><span class="text-xl md:text-2xl">❌</span></div>
                    <div class="text-xl md:text-2xl font-bold text-red-600" id="countDitolak">-</div>
                    <div class="text-[10px] md:text-xs text-gray-500 mt-1">Ditolak</div>
                </button>
            </div>

            <!-- Filter Box Ramping (1 Baris Penuh) -->
            <div class="bg-rsud rounded-lg p-3 mb-3 shadow-sm">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-2">
                    <h2 class="text-sm md:text-base font-bold text-white">Daftar Pengajuan Obat</h2>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button id="resetFilter" class="text-white text-[11px] hover:underline px-2">Reset</button>
                        <button id="searchBtn" class="bg-white text-rsud px-4 py-1 rounded text-xs font-bold hover:bg-gray-100 transition w-full md:w-auto">Search</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-2">
                    <div class="lg:col-span-2">
                        <input type="text" id="searchObat" placeholder="🔍 Cari Nama Obat..." class="w-full px-3 py-1.5 rounded border-none focus:ring-2 focus:ring-emerald-300 outline-none text-xs h-full">
                    </div>
                    <div class="lg:col-span-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <input type="date" id="dariTanggal" class="w-full px-2 py-1.5 rounded border-none text-[11px] outline-none text-gray-600" title="Dari Tanggal">
                        <input type="date" id="sampaiTanggal" class="w-full px-2 py-1.5 rounded border-none text-[11px] outline-none text-gray-600" title="Sampai Tanggal">
                        <select id="tipePengajuan" class="w-full px-2 py-1.5 rounded border-none bg-white text-[11px] outline-none text-gray-600">
                            <option value="">Semua Tipe</option>
                            <option value="reguler">Reguler</option>
                        </select>
                        <select id="filterKsm" class="w-full px-2 py-1.5 rounded border-none bg-white text-[11px] outline-none text-gray-600">
                            <option value="">Semua KSM</option>
                            <option value="Anak-Jtg-Saraf-Gilut">Anak-Jtg-Saraf-Gilut</option>
                            <option value="Jantung">Jantung</option>
                            <option value="Syaraf dan Jiwa">Syaraf dan Jiwa</option>
                            <option value="Bedah Gigi & Mulut">Bedah Gigi & Mulut</option>
                            <option value="Paru">Paru</option>
                            <option value="Kulit">Kulit</option>
                            <option value="Penunjang">Penunjang</option>
                            <option value="Umum">Umum</option>
                            <option value="IPD">IPD</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi Ramping -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-2">
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button id="ajukanBtn" class="bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded text-[11px] font-medium hover:bg-gray-50 transition flex justify-center items-center gap-1.5 shadow-sm">
                        <span>+</span> Ajukan Obat
                    </button>
                    <button id="masterObatBtn" class="bg-white border border-gray-300 text-rsud px-3 py-1.5 rounded text-[11px] font-medium hover:bg-emerald-50 transition flex justify-center items-center gap-1.5 shadow-sm">
                        <span>⚙️</span> Master Obat
                    </button>
                    <button id="kamusObatBtn" class="bg-emerald-50 border border-emerald-300 text-emerald-700 px-3 py-1.5 rounded text-[11px] font-medium hover:bg-emerald-100 transition flex justify-center items-center gap-1.5 shadow-sm">
                        <span>📚</span> Formularium
                    </button>
                </div>
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button id="printBtn" class="bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded text-[11px] font-medium hover:bg-gray-50 transition flex justify-center items-center gap-1.5 shadow-sm">
                        <span>🖨️</span> Cetak PDF
                    </button>
                    <button id="exportBtn" class="bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded text-[11px] font-medium hover:bg-gray-50 transition flex justify-center items-center gap-1.5 shadow-sm">
                        <span>⬇</span> Excel
                    </button>
                </div>
            </div>

            <div id="infoJumlah" class="text-[11px] text-gray-500 mb-1 px-1"></div>
        </div>

        <!-- Area Tabel (Maksimal) -->
        <div id="tableScroll" class="w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pb-2 md:flex-1 md:overflow-y-auto">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto h-full">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead class="sticky top-0 z-10 bg-gray-100 shadow-sm">
                        <tr class="text-gray-600 text-[11px] uppercase tracking-wider whitespace-nowrap">
                            <th class="px-3 py-2 font-semibold">No</th>
                            <th class="px-3 py-2 font-semibold">Tanggal</th>
                            <th class="px-3 py-2 font-semibold">Nama Obat</th>
                            <th class="px-3 py-2 font-semibold">KSM</th>
                            <th class="px-3 py-2 font-semibold">Status</th>
                            <th class="px-3 py-2 font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="w-full max-w-[95%] 2xl:max-w-[1800px] mx-auto px-4 pb-3 flex-shrink-0">
            <div id="pagination" class="mt-2"></div>
        </div>

    </main>

    <!-- Modal Print -->
    <div id="printModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center flex-shrink-0">
                <h3 class="text-base font-bold text-gray-800">🖨️ Pilih Jenis Cetakan</h3>
                <button onclick="closePrintModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div class="space-y-2">
                    <label class="flex items-start gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:border-emerald-400 transition" id="radioDaftarLabel">
                        <input type="radio" name="printMode" value="daftar" checked class="mt-0.5 w-4 h-4" onchange="onPrintModeChange()">
                        <div class="flex-1">
                            <div class="font-semibold text-sm text-gray-800">📋 Cetak Daftar Pengajuan</div>
                            <div class="text-[11px] text-gray-500 mt-0.5">Cetak tabel daftar pengajuan yang tampil (<span id="modalCountDaftar" class="font-semibold text-emerald-600">0</span> data)</div>
                        </div>
                    </label>
                    <label class="flex items-start gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:border-emerald-400 transition" id="radioFormLabel">
                        <input type="radio" name="printMode" value="form" class="mt-0.5 w-4 h-4" onchange="onPrintModeChange()">
                        <div class="flex-1">
                            <div class="font-semibold text-sm text-gray-800">📄 Cetak Form Pengajuan</div>
                            <div class="text-[11px] text-gray-500 mt-0.5">Pilih pengajuan yang ingin dicetak formulir lengkapnya</div>
                        </div>
                    </label>
                </div>
                <div id="modalFormList" class="hidden mt-3 border-t pt-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-medium text-gray-700">Pilih Pengajuan:</span>
                        <div class="flex gap-2">
                            <button onclick="selectAllForm(true)" class="text-[11px] text-emerald-600 hover:underline font-medium">Pilih Semua</button>
                            <button onclick="selectAllForm(false)" class="text-[11px] text-gray-500 hover:underline font-medium">Kosongkan</button>
                        </div>
                    </div>
                    <div id="modalCheckboxList" class="space-y-1 max-h-48 overflow-y-auto border border-gray-200 rounded-lg p-2 bg-gray-50"></div>
                    <div class="mt-1 text-[11px] text-gray-500"><span id="modalCountSelected">0</span> pengajuan dipilih</div>
                </div>
            </div>
            <div class="p-3 border-t flex justify-end gap-2 flex-shrink-0 bg-gray-50 rounded-b-xl">
                <button onclick="closePrintModal()" class="px-3 py-1.5 border border-gray-300 rounded text-xs text-gray-700 hover:bg-white transition font-medium">Batal</button>
                <button onclick="doPrint()" class="px-4 py-1.5 bg-rsud text-white rounded text-xs font-semibold hover:bg-emerald-700 transition">🖨️ Cetak Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://liyjnpjawjkobopwuhnb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1ia1Sofbm9IFgO3cQbeiPw_KNslUtii';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allPengajuan = [];
        let filteredPengajuan = [];
        let activeTab = 'tugas-saya';
        let currentPage = 1;
        const PER_PAGE = 10;

        function relativeTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffSec = Math.floor((now - date) / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            if (diffSec < 60) return 'baru saja';
            if (diffMin < 60) return `${diffMin} menit lalu`;
            if (diffHour < 24) return `${diffHour} jam lalu`;
            if (diffDay < 7) return `${diffDay} hari lalu`;
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getStatusBadge(status) {
            const map = {
                'draft':                { label: 'Draft', icon: '📝', cls: 'bg-gray-100 text-gray-700' },
                'menunggu_ketua_ksm':   { label: 'Menunggu Ketua KSM', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_anggota_pft': { label: 'Menunggu Anggota PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_ketua_pft':   { label: 'Menunggu Ketua PFT', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'menunggu_wadir':       { label: 'Menunggu Wadir', icon: '⏳', cls: 'bg-yellow-100 text-yellow-700' },
                'disetujui':            { label: 'Disetujui', icon: '✅', cls: 'bg-green-100 text-green-700' },
                'ditolak':              { label: 'Ditolak', icon: '❌', cls: 'bg-red-100 text-red-700' }
            };
            const item = map[status] || { label: status, icon: '•', cls: 'bg-gray-100 text-gray-700' };
            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold inline-flex items-center gap-1 ${item.cls} whitespace-nowrap">
                <span>${item.icon}</span> ${item.label}
            </span>`;
        }

        function isMyTask(item) {
            if (!currentUser) return false;
            const role = currentUser.role;
            const status = item.status;
            const taskMap = {
                'ketua_ksm':   'menunggu_ketua_ksm',
                'anggota_pft': 'menunggu_anggota_pft',
                'ketua_pft':   'menunggu_ketua_pft',
                'wadir':       'menunggu_wadir'
            };
            if (role === 'admin_ksm') {
                return item.admin_ksm_id === currentUser.id && !['disetujui', 'ditolak'].includes(status);
            }
            return status === taskMap[role];
        }

        async function checkAuth() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabaseClient.from('users').select('*').eq('id', session.user.id).single();
            if (profile) {
                currentUser = profile;
                document.getElementById('greeting').textContent = `Halo, ${profile.nama_lengkap} (${profile.role.replace(/_/g, ' ').toUpperCase()})`;
                if (profile.role !== 'admin_ksm') {
                    document.getElementById('ajukanBtn').style.display = 'none';
                }
            }
            renderSkeleton();
            fetchPengajuan();
        }

        function renderSkeleton() {
            const tbody = document.getElementById('tableBody');
            let rows = '';
            for (let i = 0; i < 5; i++) {
                rows += `<tr>
                    <td class="p-3"><div class="h-4 w-8 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-24 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-32 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-20 bg-gray-200 rounded skeleton"></div></td>
                    <td class="p-3"><div class="h-6 w-28 bg-gray-200 rounded-full skeleton"></div></td>
                    <td class="p-3"><div class="h-4 w-12 bg-gray-200 rounded skeleton"></div></td>
                </tr>`;
            }
            tbody.innerHTML = rows;
        }

        async function fetchPengajuan() {
            const tbody = document.getElementById('tableBody');
            const { data, error } = await supabaseClient
                .from('pengajuan')
                .select(`*, pengaju:admin_ksm_id (nama_lengkap, ksm)`)
                .order('created_at', { ascending: false });
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }
            allPengajuan = data;
            updateStatCards();
            applyTabFilter();
        }

        function updateStatCards() {
            const total = allPengajuan.length;
            const disetujui = allPengajuan.filter(p => p.status === 'disetujui').length;
            const ditolak = allPengajuan.filter(p => p.status === 'ditolak').length;
            const tugasSaya = allPengajuan.filter(isMyTask).length;
            document.getElementById('countTugasSaya').textContent = tugasSaya;
            document.getElementById('countSemua').textContent = total;
            document.getElementById('countDisetujui').textContent = disetujui;
            document.getElementById('countDitolak').textContent = ditolak;
        }

        function applyTabFilter() {
            let base = [...allPengajuan];
            if (activeTab === 'tugas-saya') base = base.filter(isMyTask);
            else if (activeTab === 'disetujui') base = base.filter(p => p.status === 'disetujui');
            else if (activeTab === 'ditolak') base = base.filter(p => p.status === 'ditolak');
            applyFormFilter(base);
        }

        function applyFormFilter(baseData) {
            const namaObat = document.getElementById('searchObat').value.toLowerCase().trim();
            const dari = document.getElementById('dariTanggal').value;
            const sampai = document.getElementById('sampaiTanggal').value;
            const ksm = document.getElementById('filterKsm').value;
            filteredPengajuan = baseData.filter(item => {
                if (namaObat && !item.nama_obat.toLowerCase().includes(namaObat)) return false;
                const tgl = item.tanggal_pengajuan;
                if (dari && tgl < dari) return false;
                if (sampai && tgl > sampai) return false;
                if (ksm && item.pengaju?.ksm !== ksm) return false;
                return true;
            });
            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const infoJumlah = document.getElementById('infoJumlah');
            if (filteredPengajuan.length === 0) {
                const emptyMsg = activeTab === 'tugas-saya' 
                    ? '🎉 Tidak ada tugas untuk Anda saat ini. Kerja bagus!'
                    : 'Tidak ada data yang cocok dengan filter.';
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">${emptyMsg}</td></tr>`;
                infoJumlah.textContent = `Menampilkan 0 data`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            const totalPages = Math.ceil(filteredPengajuan.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            const startIdx = (currentPage - 1) * PER_PAGE;
            const endIdx = startIdx + PER_PAGE;
            const pageData = filteredPengajuan.slice(startIdx, endIdx);

            tbody.innerHTML = pageData.map((item, idx) => {
                const globalIdx = startIdx + idx;
                const highlight = isMyTask(item);
                const rowClass = highlight ? 'bg-yellow-50 border-l-4 border-yellow-400 hover:bg-yellow-100' : 'hover:bg-gray-50';
                return `
                    <tr class="${rowClass} transition">
                        <td class="p-3">${globalIdx + 1}</td>
                        <td class="p-3">
                            <div class="font-medium whitespace-nowrap">${relativeTime(item.tanggal_pengajuan)}</div>
                            <div class="text-xs text-gray-400 whitespace-nowrap">${new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID')}</div>
                        </td>
                        <td class="p-3 font-medium">${item.nama_obat}</td>
                        <td class="p-3 whitespace-nowrap">${item.pengaju?.ksm || '-'}</td>
                        <td class="p-3">${getStatusBadge(item.status)}</td>
                        <td class="p-3">
                            <button class="text-rsud hover:underline text-sm font-medium whitespace-nowrap" onclick="lihatDetail('${item.id}')">
                                ${highlight ? '👉 Proses' : 'Lihat'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            const tabLabel = { 'tugas-saya': 'Tugas Saya', 'semua': 'Semua Pengajuan', 'disetujui': 'Disetujui', 'ditolak': 'Ditolak' }[activeTab];
            infoJumlah.textContent = `Menampilkan ${startIdx + 1}-${Math.min(endIdx, filteredPengajuan.length)} dari ${filteredPengajuan.length} data di "${tabLabel}"`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '<div class="flex items-center justify-center gap-1 flex-wrap">';
            const prevDisabled = currentPage === 1;
            html += `<button onclick="goToPage(${currentPage - 1})" ${prevDisabled ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg text-sm font-medium border ${prevDisabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">‹ Prev</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (totalPages > 7) {
                    if (i !== 1 && i !== totalPages && Math.abs(i - currentPage) > 1) {
                        if (i === 2 || i === totalPages - 1) html += `<span class="px-2 text-gray-400">...</span>`;
                        continue;
                    }
                }
                const active = i === currentPage;
                html += `<button onclick="goToPage(${i})" class="px-3 py-1.5 rounded-lg text-sm font-medium border ${active ? 'bg-rsud text-white border-rsud' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">${i}</button>`;
            }
            const nextDisabled = currentPage === totalPages;
            html += `<button onclick="goToPage(${currentPage + 1})" ${nextDisabled ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg text-sm font-medium border ${nextDisabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">Next ›</button>`;
            html += '</div>';
            container.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredPengajuan.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            if (window.innerWidth >= 768) {
                document.getElementById('tableScroll').scrollTop = 0;
            }
        }

        function switchTab(tabName) {
            activeTab = tabName;
            currentPage = 1;
            document.querySelectorAll('.stat-card').forEach(card => {
                if (card.dataset.tab === tabName) {
                    card.classList.add('active');
                    if (tabName === 'tugas-saya') {
                        card.classList.add('bg-rsud', 'text-white');
                        card.classList.remove('bg-white', 'text-gray-700');
                    }
                } else { card.classList.remove('active'); }
            });
            applyTabFilter();
        }

        function resetFilter() {
            document.getElementById('searchObat').value = '';
            document.getElementById('dariTanggal').value = '';
            document.getElementById('sampaiTanggal').value = '';
            document.getElementById('tipePengajuan').value = '';
            document.getElementById('filterKsm').value = '';
            currentPage = 1;
            applyTabFilter();
        }

        function exportExcel() {
            if (filteredPengajuan.length === 0) { alert('Tidak ada data untuk diekspor.'); return; }
            const dataExcel = filteredPengajuan.map((item, index) => ({
                'No': index + 1,
                'Tanggal Pengajuan': new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID'),
                'Nama Obat': item.nama_obat,
                'KSM': item.pengaju?.ksm || '-',
                'Pemberi Persetujuan': item.pemberi_persetujuan || '-',
                'Alasan Pengajuan': item.alasan_pengajuan || '-',
                'Status': item.status.replace(/_/g, ' ').toUpperCase(),
                'Tanggal Dibuat': new Date(item.created_at).toLocaleString('id-ID')
            }));
            const ws = XLSX.utils.json_to_sheet(dataExcel);
            ws['!cols'] = [{ wch: 5 }, { wch: 15 }, { wch: 25 }, { wch: 20 }, { wch: 25 }, { wch: 40 }, { wch: 20 }, { wch: 20 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Pengajuan Obat');
            const today = new Date();
            const fileName = `pengajuan-obat-${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        function openPrintModal() {
            if (filteredPengajuan.length === 0) { alert('Tidak ada data untuk dicetak.'); return; }
            document.getElementById('modalCountDaftar').textContent = filteredPengajuan.length;
            document.getElementById('printModal').classList.remove('hidden');
            document.querySelector('input[name="printMode"][value="daftar"]').checked = true;
            onPrintModeChange();
        }

        function closePrintModal() { document.getElementById('printModal').classList.add('hidden'); }

        function onPrintModeChange() {
            const mode = document.querySelector('input[name="printMode"]:checked').value;
            const formList = document.getElementById('modalFormList');
            document.getElementById('radioDaftarLabel').className = mode === 'daftar' ? 'flex items-start gap-3 p-4 border-2 border-emerald-500 bg-emerald-50 rounded-lg cursor-pointer transition' : 'flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-emerald-400 transition';
            document.getElementById('radioFormLabel').className = mode === 'form' ? 'flex items-start gap-3 p-4 border-2 border-emerald-500 bg-emerald-50 rounded-lg cursor-pointer transition' : 'flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-emerald-400 transition';
            if (mode === 'form') {
                formList.classList.remove('hidden');
                renderCheckboxList();
            } else { formList.classList.add('hidden'); }
        }

        function renderCheckboxList() {
            const container = document.getElementById('modalCheckboxList');
            container.innerHTML = filteredPengajuan.map((item) => `
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded cursor-pointer transition">
                    <input type="checkbox" class="modal-checkbox w-4 h-4" value="${item.id}" onchange="updateSelectedCount()">
                    <div class="flex-1 text-sm">
                        <div class="font-medium text-gray-800">${item.nama_obat}</div>
                        <div class="text-xs text-gray-500">${new Date(item.tanggal_pengajuan).toLocaleDateString('id-ID')} • ${item.pengaju?.ksm || '-'}</div>
                    </div>
                </label>
            `).join('');
            updateSelectedCount();
        }

        function selectAllForm(checked) {
            document.querySelectorAll('.modal-checkbox').forEach(cb => { cb.checked = checked; });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = document.querySelectorAll('.modal-checkbox:checked').length;
            document.getElementById('modalCountSelected').textContent = count;
        }

        function doPrint() {
            const mode = document.querySelector('input[name="printMode"]:checked').value;
            let ids = [];
            if (mode === 'daftar') { ids = filteredPengajuan.map(p => p.id); } 
            else {
                ids = Array.from(document.querySelectorAll('.modal-checkbox:checked')).map(cb => cb.value);
                if (ids.length === 0) { alert('Pilih minimal 1 pengajuan untuk dicetak.'); return; }
            }
            const idsParam = ids.join(',');
            window.open(`cetak.html?mode=${mode}&ids=${encodeURIComponent(idsParam)}`, '_blank');
            closePrintModal();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        document.getElementById('ajukanBtn').addEventListener('click', () => { window.location.href = 'pengajuan.html'; });
        document.getElementById('masterObatBtn').addEventListener('click', () => { window.location.href = 'master_obat.html'; });
        
        // Event Listener untuk Formularium Obat
        document.getElementById('kamusObatBtn').addEventListener('click', () => { window.location.href = 'kamus_obat.html'; });
        
        document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; applyTabFilter(); });
        document.getElementById('resetFilter').addEventListener('click', resetFilter);
        document.getElementById('exportBtn').addEventListener('click', exportExcel);
        document.getElementById('printBtn').addEventListener('click', openPrintModal);
        document.getElementById('searchObat').addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); currentPage = 1; applyTabFilter(); } });
        document.querySelectorAll('.stat-card').forEach(card => { card.addEventListener('click', () => switchTab(card.dataset.tab)); });
        document.getElementById('printModal').addEventListener('click', (e) => { if (e.target.id === 'printModal') closePrintModal(); });

        function lihatDetail(id) { window.location.href = 'detail.html?id=' + id; }

        checkAuth();
    </script>
</body>
</html>
